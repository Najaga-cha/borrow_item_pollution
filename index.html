<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ระบบใบยืมเครื่องมือ - ศูนย์สนับสนุนการตรวจวัดมลพิษ</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@500;600;700&display=swap');

@font-face{
  font-family:'TH Sarabun PSK';
  src: url('https://cdn.jsdelivr.net/gh/SarabunConsortium/TH-Sarabun-PSK@master/THSarabunPSK%20Regular.ttf') format('truetype');
  font-weight:400; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'TH Sarabun PSK';
  src: url('https://cdn.jsdelivr.net/gh/SarabunConsortium/TH-Sarabun-PSK@master/THSarabunPSK%20Bold.ttf') format('truetype');
  font-weight:700; font-style:normal; font-display:swap;
}
@font-face{
  font-family:'TH Sarabun PSK';
  src: url('https://cdn.jsdelivr.net/gh/SarabunConsortium/TH-Sarabun-PSK@master/THSarabunPSK%20Italic.ttf') format('truetype');
  font-weight:400; font-style:italic; font-display:swap;
}
@font-face{
  font-family:'TH Sarabun PSK';
  src: url('https://cdn.jsdelivr.net/gh/SarabunConsortium/TH-Sarabun-PSK@master/THSarabunPSK%20BoldItalic.ttf') format('truetype');
  font-weight:700; font-style:italic; font-display:swap;
}

:root[data-theme="light"]{
  --bg: #f3f7f6;
  --bg-grad1: #e9f9f3;
  --bg-grad2: #eef6ff;
  --card: #ffffff;
  --text: #16302b;
  --subtle: #5b6b68;
  --border: #e1e8e6;
  --input-bg: #ffffff;
  --input-border: #d7e2df;
  --header-bg: linear-gradient(120deg,#0f766e,#0891b2 55%,#0369a1);
  --header-text: #ffffff;
  --primary: #0f766e;
  --primary-dark: #0d5f59;
  --chip-bg: #f4faf8;
  --shadow: 0 1px 3px rgba(15,60,50,.08), 0 6px 18px rgba(15,60,50,.06);
}
:root[data-theme="dark"]{
  --bg: #0f1a18;
  --bg-grad1: #0b1512;
  --bg-grad2: #0c1620;
  --card: #16211f;
  --text: #eaf3f1;
  --subtle: #9db3af;
  --border: #223330;
  --input-bg: #101c1a;
  --input-border: #2a3d39;
  --header-bg: linear-gradient(120deg,#0b3d38,#0e5266 55%,#0b3f5e);
  --header-text: #eafffb;
  --primary: #2dd4bf;
  --primary-dark: #14b8a6;
  --chip-bg: #16211f;
  --shadow: 0 1px 3px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.35);
}

*{ box-sizing: border-box; }
html,body{ margin:0; padding:0; }
body{
  font-family: 'Sarabun', 'Kanit', system-ui, sans-serif;
  background:
    radial-gradient(1200px 500px at 10% -5%, var(--bg-grad1), transparent),
    radial-gradient(1200px 500px at 100% 0%, var(--bg-grad2), transparent),
    var(--bg);
  color: var(--text);
  min-height: 100vh;
}
h1,h2,h3{ font-family:'Kanit','Sarabun',sans-serif; }

.header-band{ background: var(--header-bg); color: var(--header-text); border-radius: 0 0 28px 28px; box-shadow: var(--shadow); }
.header-title{ color: var(--header-text); }
.header-sub{ color: rgba(255,255,255,.85); }
.logo-badge{ width:64px; height:64px; border-radius:14px; background:rgba(255,255,255,.92); display:flex; align-items:center; justify-content:center; padding:6px; box-shadow:0 2px 8px rgba(0,0,0,.15); flex-shrink:0; }
.logo-badge svg{ width:100%; height:100%; display:block; }
@media (min-width:768px){ .logo-badge{ width:80px; height:80px; } }

.tabbar{ display:flex; gap:8px; flex-wrap:wrap; }
.tab-btn{ padding:10px 16px; border-radius:12px; background:rgba(255,255,255,.12); color:var(--header-text); font-weight:600; border:1px solid rgba(255,255,255,.25); cursor:pointer; transition:.15s; font-size:14px;}
.tab-btn:hover{ background:rgba(255,255,255,.22); }
.tab-active{ background:#ffffff; color:#0f766e; }

.btn-theme{ width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); cursor:pointer; font-size:16px;}

/* ===== Notification Bell ===== */
.notif-wrap{ position:relative; }
.notif-bell{ position:relative; width:38px; height:38px; border-radius:10px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:.15s; color:var(--header-text); }
.notif-bell:hover{ background:rgba(255,255,255,.28); }
.notif-bell svg{ width:19px; height:19px; display:block; }
.notif-bell.has-alert{ animation: notifShake 2.4s ease-in-out infinite; }
.notif-bell.has-alert svg{ animation: notifGlow 1.6s ease-in-out infinite; }
@keyframes notifGlow{
  0%,100%{ filter: drop-shadow(0 0 0 rgba(220,38,38,0)); color: var(--header-text); }
  50%{ filter: drop-shadow(0 0 6px rgba(248,113,113,.95)); color:#fecaca; }
}
@keyframes notifShake{
  0%,92%,100%{ transform:rotate(0deg); }
  93%{ transform:rotate(-12deg); }
  94.5%{ transform:rotate(10deg); }
  96%{ transform:rotate(-8deg); }
  97.5%{ transform:rotate(5deg); }
  99%{ transform:rotate(0deg); }
}
.notif-badge{ position:absolute; top:-5px; right:-5px; min-width:17px; height:17px; padding:0 4px; border-radius:999px; background:#dc2626; color:#fff; font-size:10px; font-weight:800; line-height:17px; text-align:center; box-shadow:0 0 0 2px var(--primary,#0f766e); }
.notif-badge.pulse{ animation: notifBadgePulse 1.4s ease-in-out infinite; }
.tab-corner-badge{ position:absolute; top:-7px; right:-7px; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:#dc2626; color:#fff; font-size:10.5px; font-weight:800; line-height:18px; text-align:center; box-shadow:0 0 0 2px var(--card,#fff); animation: notifBadgePulse 1.4s ease-in-out infinite; }
@keyframes notifBadgePulse{
  0%,100%{ box-shadow:0 0 0 2px var(--primary,#0f766e), 0 0 0 0 rgba(220,38,38,.65); }
  50%{ box-shadow:0 0 0 2px var(--primary,#0f766e), 0 0 0 6px rgba(220,38,38,0); }
}
.notif-panel{ position:absolute; top:48px; right:0; width:340px; max-width:88vw; max-height:420px; overflow:hidden; display:flex; flex-direction:column; background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:14px; box-shadow: 0 12px 32px rgba(0,0,0,.22); z-index:60; }
@media (max-width:480px){ .notif-panel{ position:fixed; top:auto; bottom:0; left:0; right:0; width:100%; max-width:100%; border-radius:16px 16px 0 0; max-height:70vh; } }
.notif-panel-head{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
.notif-panel-title{ font-weight:700; font-size:14px; }
.notif-panel-mark{ font-size:12px; font-weight:600; color: var(--primary); background:none; border:none; cursor:pointer; padding:2px 4px; }
.notif-panel-mark:hover{ text-decoration:underline; }
.notif-panel-body{ overflow-y:auto; flex:1; }
.notif-item{ display:flex; gap:10px; align-items:flex-start; padding:11px 14px; border-bottom:1px solid var(--border); cursor:pointer; transition:.12s; }
.notif-item:last-child{ border-bottom:none; }
.notif-item:hover{ background: var(--chip-bg); }
.notif-item.unread{ background: rgba(220,38,38,.06); }
.notif-icon{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
.notif-icon.new{ background:rgba(15,118,110,.12); }
.notif-icon.late{ background:rgba(220,38,38,.12); }
.notif-text{ flex:1; min-width:0; }
.notif-title{ font-size:13px; font-weight:700; margin-bottom:2px; }
.notif-sub{ font-size:12px; color:var(--subtle); }
.notif-time{ font-size:10.5px; color:var(--subtle); margin-top:3px; }
.notif-dot{ width:7px; height:7px; border-radius:999px; background:#dc2626; flex-shrink:0; margin-top:5px; }
.notif-empty{ padding:32px 16px; text-align:center; color:var(--subtle); font-size:13px; }

/* ===== Notification Toast (พรีวิวแจ้งเตือนแบบเด้งจางๆ) ===== */
.notif-toast-container{ position:fixed; top:76px; right:16px; z-index:9999; display:flex; flex-direction:column; gap:8px; pointer-events:none; max-width:92vw; }
@media (max-width:480px){ .notif-toast-container{ left:16px; right:16px; top:auto; bottom:16px; align-items:stretch; } }
.notif-toast{ pointer-events:auto; display:flex; gap:10px; align-items:flex-start; background:var(--card); color:var(--text); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:11px 14px; width:300px; max-width:100%; opacity:0; transform:translateY(-10px) scale(.98); transition:opacity .35s ease, transform .35s ease; }
@media (max-width:480px){ .notif-toast{ width:100%; } }
.notif-toast.show{ opacity:1; transform:translateY(0) scale(1); }
.notif-toast-icon{ width:30px; height:30px; border-radius:9px; background:rgba(15,118,110,.12); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.notif-toast-icon.late{ background:rgba(220,38,38,.12); }
.notif-toast-text{ flex:1; min-width:0; }
.notif-toast-title{ font-size:13px; font-weight:700; }
.notif-toast-sub{ font-size:12px; color:var(--subtle); margin-top:1px; }
.btn-ghost{ padding:9px 14px; border-radius:10px; background:var(--card); border:1px solid var(--border); color:var(--text); cursor:pointer; font-weight:600; font-size:13.5px; transition:.15s;}
.btn-ghost:hover{ background: var(--chip-bg); }
.btn-primary{ padding:10px 18px; border-radius:10px; background: var(--primary); color:#fff; border:none; cursor:pointer; font-weight:700; font-size:14px; box-shadow: 0 4px 12px rgba(15,118,110,.3); transition:.15s;}
.btn-primary:hover{ background: var(--primary-dark); }
.btn-mini-primary{ padding:5px 10px; border-radius:8px; background:#16a34a; color:#fff; border:none; cursor:pointer; font-weight:700; font-size:11.5px; white-space:nowrap; transition:.15s; }
.btn-mini-primary:hover{ background:#15803d; }
.btn-calib-done{ display:inline-flex; align-items:center; justify-content:center; gap:5px; padding:6px 13px; border-radius:999px; background:#ecfdf5; color:#047857; border:1px solid #a7f3d0; cursor:pointer; font-weight:600; font-size:11.5px; white-space:nowrap; transition:.15s ease; }
.btn-calib-done svg{ width:12.5px; height:12.5px; flex-shrink:0; }
.btn-calib-done:hover{ background:#d1fae5; border-color:#6ee7b7; color:#047857; box-shadow:0 2px 8px rgba(5,150,105,.18); transform:translateY(-1px); }
.btn-calib-done:active{ transform:translateY(0); box-shadow:none; }
:root[data-theme="dark"] .btn-calib-done{ background:rgba(16,185,129,.12); color:#6ee7b7; border-color:rgba(16,185,129,.35); }
:root[data-theme="dark"] .btn-calib-done:hover{ background:rgba(16,185,129,.2); border-color:rgba(16,185,129,.5); }
.btn-danger{ padding:9px 14px; border-radius:10px; background:#fef2f2; color:#dc2626; border:1px solid #fecaca; cursor:pointer; font-weight:600; font-size:13.5px;}
:root[data-theme="dark"] .btn-danger{ background:#3a1414; color:#f87171; border-color:#5c1f1f; }
.btn-early-return{ padding:9px 14px; border-radius:10px; background:#eff6ff; color:#0369a1; border:1px solid #bae6fd; cursor:pointer; font-weight:600; font-size:13.5px; transition:.15s;}
.btn-early-return:hover{ background:#dbeafe; }
:root[data-theme="dark"] .btn-early-return{ background:#0c1c2e; color:#7dd3fc; border-color:#0e3a5c; }

.card{ background: var(--card); border:1px solid var(--border); border-radius:18px; box-shadow: var(--shadow); }

.lbl{ display:block; font-size:13px; font-weight:600; color:var(--subtle); margin-bottom:5px; }
.inp{ width:100%; padding:10px 12px; border-radius:10px; border:1.5px solid var(--input-border); background: var(--input-bg); color:var(--text); font-size:14px; font-family:inherit; }
.inp:focus{ outline:none; border-color: var(--primary); }
.inp-sm{ padding:6px 8px; border-radius:8px; border:1.5px solid var(--input-border); background:var(--input-bg); color:var(--text); font-size:12.5px; font-family:inherit; }
.hint-be{ font-size:11.5px; color:var(--subtle); margin-top:3px; }
.empty-hint{ padding:20px; text-align:center; color:var(--subtle); background:var(--chip-bg); border-radius:12px; font-size:13.5px; border:1px dashed var(--border);}

.cat-chip{ padding:9px 16px; border-radius:999px; border:2px solid var(--c); background:var(--c2); color:var(--text); font-weight:600; font-size:13.5px; cursor:pointer; transition:.15s;}
:root[data-theme="dark"] .cat-chip{ background:transparent; }
.cat-chip-active{ background: var(--c); color:#fff; }

.ms-dropdown{ position:relative; }
.ms-dropdown-btn{ width:100%; display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--input-border); background:var(--input-bg); color:var(--text); font-size:13.5px; font-family:inherit; cursor:pointer; text-align:left; }
.ms-dropdown-btn:hover{ border-color: var(--primary); }
.ms-dropdown-btn-open{ border-color: var(--primary); }
.ms-dropdown-caret{ color:var(--subtle); font-size:11px; transition:.15s; }
.ms-dropdown-btn-open .ms-dropdown-caret{ transform:rotate(180deg); }
.ms-dropdown-panel{ position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:30; background:var(--card); border:1.5px solid var(--input-border); border-radius:12px; box-shadow: var(--shadow); padding:8px; }
.ms-dropdown-search{ width:100%; margin-bottom:6px; }
.ms-dropdown-list{ max-height:200px; overflow-y:auto; }
.ms-dropdown-empty{ padding:14px 8px; text-align:center; color:var(--subtle); font-size:13px; }
.ms-dropdown-item{ display:flex; align-items:center; gap:9px; padding:8px 9px; border-radius:8px; cursor:pointer; font-size:13.5px; }
.ms-dropdown-item:hover{ background: var(--chip-bg); }
.ms-dropdown-item input{ width:16px; height:16px; accent-color: var(--primary); flex-shrink:0; }

.cat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.cat-card{ position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; padding:16px 10px 12px; border-radius:14px; border:2px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; transition:.15s; }
.cat-card:hover{ border-color:var(--c); background:var(--c2); }
:root[data-theme="dark"] .cat-card:hover{ background:rgba(255,255,255,.04); }
.cat-card-active{ border-color:var(--c); background:var(--c2); box-shadow:0 0 0 2px var(--c) inset; }
:root[data-theme="dark"] .cat-card-active{ background:rgba(255,255,255,.05); }
.cat-card-check{ position:absolute; top:8px; right:10px; font-size:13px; line-height:1; }
.cat-card-icon{ font-size:26px; line-height:1; }
.cat-card-name{ font-weight:700; font-size:13.5px; }
.cat-card-count{ font-size:11px; color:var(--subtle); }

.tool-panel{ border:1.5px solid var(--border); border-left:6px solid var(--c); border-radius:14px; overflow:hidden; }
.tool-panel-head{ padding:10px 14px; font-weight:700; background: var(--c2); color:var(--text); }
:root[data-theme="dark"] .tool-panel-head{ background:rgba(255,255,255,.03); }
.tool-list{ padding:6px 10px 10px; }
.tool-row{ display:flex; align-items:center; gap:10px; padding:8px 6px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
.tool-row:last-child{ border-bottom:none; }
.tool-row-disabled{ opacity:.5; }
.chk{ width:17px; height:17px; accent-color: var(--primary); }
.qty-badge{ font-size:11.5px; padding:3px 9px; border-radius:999px; background:#dcfce7; color:#15803d; font-weight:700; white-space:nowrap;}
:root[data-theme="dark"] .qty-badge{ background:#0e2a1c; color:#4ade80; }
.qty-zero{ background:#fee2e2; color:#b91c1c; }
:root[data-theme="dark"] .qty-zero{ background:#3a1414; color:#f87171; }
.qty-input{ width:56px; padding:5px 6px; border-radius:8px; border:1.5px solid var(--input-border); background:var(--input-bg); color:var(--text); font-size:13px; }

.success-banner{ background: linear-gradient(90deg,#ecfdf5,#eff6ff); border:1.5px solid #a7f3d0; border-radius:16px; padding:16px 20px; }
:root[data-theme="dark"] .success-banner{ background: linear-gradient(90deg,#0e2a1c,#0c1c2e); border-color:#14532d; }

.pill{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700; background:var(--chip-bg); color:var(--subtle); }
.pill-ok{ background:#dcfce7; color:#15803d; }
:root[data-theme="dark"] .pill-ok{ background:rgba(34,197,94,.22); color:#4ade80; border:1px solid rgba(74,222,128,.45); }
.pill-warn{ background:#fef3c7; color:#92400e; }
:root[data-theme="dark"] .pill-warn{ background:rgba(245,158,11,.24); color:#fcd34d; border:1px solid rgba(251,191,36,.5); }
.pill-danger{ background:#fee2e2; color:#b91c1c; }
:root[data-theme="dark"] .pill-danger{ background:rgba(239,68,68,.26); color:#fca5a5; border:1px solid rgba(248,113,113,.55); }
.calib-row-danger{ background:rgba(254,226,226,.5); }
.calib-row-warn{ background:rgba(254,243,199,.5); }
:root[data-theme="dark"] .calib-row-danger{ background:rgba(58,20,20,.4); }
:root[data-theme="dark"] .calib-row-warn{ background:rgba(58,42,14,.4); }
.pill-clock{ background:rgba(255,255,255,.16); color:var(--header-text); border:1px solid rgba(255,255,255,.28); font-weight:600; font-size:12.5px; padding:5px 12px; letter-spacing:.2px; }
.mini-chip{ font-size:11px; padding:2px 8px; border-radius:999px; background: color-mix(in srgb, var(--c) 18%, transparent); border:1px solid var(--c); color:var(--text); white-space:nowrap;}

.table-wrap{ overflow-x:auto; }
.data-table{ width:100%; border-collapse:collapse; font-size:13px; }
.data-table th{ text-align:left; padding:9px 10px; background:var(--chip-bg); color:var(--subtle); font-weight:700; white-space:nowrap; border-bottom:2px solid var(--border);}
.data-table td{ padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:middle; }
.data-table tr:hover td{ background: var(--chip-bg); }
.calib-asset-code{ white-space:nowrap; }
.calib-qty-cell{ white-space:nowrap; }
.calib-plan-table th{ white-space:nowrap; }
.calib-plan-table td{ vertical-align:top; }
.calib-plan-table{ border:1px solid var(--border); }
.calib-plan-table th, .calib-plan-table td{ border:1px solid var(--border); }
.calib-plan-table thead th{ border-bottom:2px solid var(--border); }

.icon-btn{ background:none; border:none; cursor:pointer; font-size:15px; padding:4px 6px; border-radius:6px; }
.icon-btn[data-act="close-modal"]{ font-size:22px; line-height:1; font-weight:600; color:var(--text); }
.chart-dl-btn{ background:none; border:1px solid var(--border); cursor:pointer; font-size:12px; padding:4px 8px; border-radius:6px; color:var(--subtle); }
.chart-dl-btn:hover{ background:var(--chip-bg); color:var(--text); }
.icon-btn:hover{ background: var(--chip-bg); }
.icon-btn:disabled{ opacity:.3; cursor:not-allowed; }
.icon-btn:disabled:hover{ background:none; }
.reorder-index{ display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:22px; padding:0 4px; border-radius:999px; background:var(--chip-bg); font-size:12px; font-weight:700; }
.reorder-row{ background:var(--card); touch-action:none; }
.drag-handle{ cursor:grab; font-size:18px; line-height:1; color:var(--sub-text,#9ca3af); padding:2px 6px; user-select:none; touch-action:none; }
.drag-handle:active{ cursor:grabbing; }
.reorder-row.dragging-row{ position:relative; z-index:30; background:var(--chip-bg); box-shadow:0 6px 18px rgba(0,0,0,.18); border-radius:10px; will-change:transform; }
.reorder-row:not(.dragging-row){ will-change:transform; }

.modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px; }

.calib-confirm-card{ max-width:420px; }

.calib-confirm-list-sub{ font-size:11.5px; color:var(--subtle); margin-top:2px; }
.calib-checkbox{ width:17px; height:17px; cursor:pointer; accent-color:#059669; }
.calib-row-selected{ background:rgba(5,150,105,.07); }

.calib-selection-bar{ position:fixed; right:24px; bottom:24px; z-index:60; display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); box-shadow:0 10px 30px rgba(0,0,0,.18); border-radius:999px; padding:10px 12px 10px 18px; animation:calibBarIn .2s ease; }

.calib-selection-count{ font-size:13px; font-weight:700; color:var(--text); white-space:nowrap; }

}

.cal-grid{ display:grid; grid-template-columns: repeat(7,1fr); gap:6px; }
.cal-grid-head{ margin-bottom:4px; }
.cal-headcell{ text-align:center; font-size:12px; font-weight:700; color:var(--subtle); padding:4px; }

.cal-sel{ outline:2px solid var(--primary); }

/* ===== Availability calendar (public-facing booking status per equipment) ===== */
.avail-free{ background:#ecfdf5; border-color:#6ee7b7; }

.avail-partial{ background:#fffbeb; border-color:#fcd34d; }
:root[data-theme="dark"] .avail-partial{ background:#2a2007; border-color:#78350f; }

.avail-legend-dot{ width:11px; height:11px; border-radius:4px; display:inline-block; margin-right:5px; vertical-align:-1px; }
.tool-avail-btn{ font-size:12px; font-weight:600; color:var(--primary); background:none; border:none; cursor:pointer; padding:2px 4px; white-space:nowrap; }
.tool-avail-btn:hover{ text-decoration:underline; }
/* ===== Admin borrow calendar — แยกสีตามสถานะ: จอง / ยืมอยู่ / คืนแล้ว ===== */
.calday-reserved{ background:#fffbeb; border-color:#fbbf24; }

.calday-active{ background:#fef2f2; border-color:#f87171; }

.borrow-item-card{ padding:12px 14px; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; background:var(--chip-bg); }

.bar-track{ height:9px; background: var(--chip-bg); border-radius:999px; overflow:hidden; border:1px solid var(--border);}

/* ============ Print ============ */
#print-area{ display:none; }
.slip-page{ font-family:'TH Sarabun PSK','Sarabun',sans-serif; font-size:16pt; color:#000; padding:14mm 16mm; }
.slip-header-line{ text-align:center; font-weight:700; font-size:22pt; margin-bottom:16px; }
.slip-field-row{ font-size:16pt; margin-bottom:10px; }

.sig-grid td.sig-cell:last-child{ padding-left:20px; }

@media print{
  .header-band{ display:none !important; }
  body.printing-slip #main-content{ display:none !important; }
  body.printing-slip #print-area{ display:block !important; }
  body.printing-slip .modal-backdrop{ display:none !important; }
  body.printing-report .modal-backdrop{ display:none !important; }
  body.printing-report .no-print{ display:none !important; }
  @page{ size:A4; margin:10mm; }

  /* ---- Report print theme: force a clean, light, high-contrast look regardless of the on-screen theme ---- */
  body.printing-report{
    --bg:#ffffff; --bg-grad1:#ffffff; --bg-grad2:#ffffff;
    --card:#ffffff; --text:#16302b; --subtle:#5b6b68; --border:#d7e2df;
    --input-bg:#ffffff; --input-border:#d7e2df;
    --header-bg:#0f766e; --header-text:#ffffff;
    --primary:#0f766e; --primary-dark:#0d5f59;
    --chip-bg:#f4faf8; --shadow:none;
    background:#fff !important;
  }
  body.printing-report, body.printing-report *{ box-shadow:none !important; text-shadow:none !important; }
  body.printing-report #main-content{ background:#fff !important; padding:0 !important; max-width:none !important; }

  /* Print-friendly report title */
  body.printing-report .report-print-title{ display:block !important; text-align:center; font-weight:800; font-size:19px; color:#0f766e; margin:0 0 12px; }

  /* Cards: crisp border instead of shadow, tighter padding, avoid splitting across a page */
  body.printing-report .card{ border:1px solid #cfe0dc !important; border-radius:10px !important; break-inside:avoid; page-break-inside:avoid; margin-bottom:10px !important; background:#fff !important; }
  body.printing-report .card.p-5{ padding:12px 14px !important; }
  body.printing-report .card.p-4{ padding:10px !important; }
  body.printing-report h3{ color:#0f766e !important; }

  /* Force multi-column grids to stay multi-column at print width, regardless of Tailwind's screen-based md: breakpoint */
  body.printing-report [class*="grid"][class*="md:grid-cols-4"]{ display:grid !important; grid-template-columns:repeat(4,1fr) !important; }
  body.printing-report [class*="grid"][class*="md:grid-cols-3"]{ display:grid !important; grid-template-columns:repeat(3,1fr) !important; }
  body.printing-report [class*="grid"][class*="md:grid-cols-2"]{ display:grid !important; grid-template-columns:repeat(2,1fr) !important; }
  body.printing-report .grid{ gap:10px !important; }

  /* Charts: fixed, print-friendly heights so canvases don't get cropped, stretched or bloated.
     Using a dedicated class (instead of matching the dynamic inline style) so this reliably
     applies to every chart box, including the department chart whose height varies with row count. */
  body.printing-report .card canvas{ max-height:170px !important; }
  body.printing-report .report-chart-box{ height:170px !important; max-height:170px !important; overflow:hidden; }

  /* Keep chart cards and the sections around them from splitting badly across a page edge */
  body.printing-report [class*="grid"][class*="md:grid-cols-3"],
  body.printing-report [class*="grid"][class*="md:grid-cols-2"]{ break-inside:avoid; page-break-inside:avoid; }

  /* Tables: crisp borders, avoid row-splitting, smaller type to fit more per page */
  body.printing-report table{ font-size:11px !important; border-collapse:collapse !important; width:100% !important; }
  body.printing-report .data-table th, body.printing-report .data-table td{ border:1px solid #d7e2df !important; padding:4px 6px !important; }
  body.printing-report .data-table th{ background:#eef6f4 !important; color:#16302b !important; }
  body.printing-report .data-table tr{ break-inside:avoid; page-break-inside:avoid; }

  /* Chips/pills/badges: outline style so they read clearly without needing background graphics */
  body.printing-report .pill, body.printing-report .mini-chip, body.printing-report .qty-badge{
    background:transparent !important; border:1px solid #cfe0dc !important; color:#16302b !important;
  }

  /* Reduce section spacing so the report reads as a tight document rather than loose app panels */
  body.printing-report .space-y-5 > * + *,
  body.printing-report [class*="space-y-"] > * + *{ margin-top:8px !important; }
}

const MEM = {}; // fallback in-memory store (used if Firestore is unreachable)

async function stGet(key, shared){
  // ข้อมูลที่ไม่ต้องแชร์ (เช่น ธีมของหน้าจอ) เก็บไว้ในเครื่องด้วย localStorage พอ
  if(!shared){
    try{
      const v = localStorage.getItem('local:'+key);
      return v !== null ? JSON.parse(v) : null;
    }catch(e){ return MEM[key] !== undefined ? MEM[key] : null; }
  }
  try{
    const snap = await db.collection(FS_COLLECTION).doc(key).get();
    if(!snap.exists) return null;
    const data = snap.data();
    return data && ('value' in data) ? data.value : null;
  }catch(e){ return MEM[key] !== undefined ? MEM[key] : null; }
}
async function stSet(key, value, shared){
  if(!shared){
    try{ localStorage.setItem('local:'+key, JSON.stringify(value)); }
    catch(e){ MEM[key] = value; }
    return;
  }
  try{ await db.collection(FS_COLLECTION).doc(key).set({ value: value }); }
  catch(e){ MEM[key] = value; }
}

/* ===================== ระบบแจ้งเตือน (กระดิ่ง) — เฉพาะ admin ที่ login แล้ว =====================
   - แจ้งเตือน "ใบยืมใหม่" เมื่อมีใบยืมเข้ามาใหม่ (ที่ยังไม่เคยเห็น)

   สถานะ "เคยเห็นแล้ว" เก็บไว้ในเครื่อง (localStorage) แยกตามเครื่อง/เบราว์เซอร์
====================================================================================== */
let notifReadBorrows = new Set();
let notifReadLate = new Set();
let notifReadCalib = new Set();
async function loadNotifReadState(){
  const seeded = await stGet('notif:seeded', false);
  const rb = await stGet('notif:readBorrows', false);
  const rl = await stGet('notif:readLate', false);
  const rc = await stGet('notif:readCalib', false);
  notifReadBorrows = new Set(Array.isArray(rb) ? rb : []);
  notifReadLate = new Set(Array.isArray(rl) ? rl : []);
  notifReadCalib = new Set(Array.isArray(rc) ? rc : []);
  if(!seeded){
    // ครั้งแรกที่เปิดระบบในเครื่องนี้ ให้ถือว่ารายการที่มีอยู่แล้วเป็น "เคยเห็นแล้ว" ทั้งหมด
    // เพื่อไม่ให้แจ้งเตือนย้อนหลังของเก่าทั้งหมดพรวดเดียว
    state.borrows.forEach(b=>notifReadBorrows.add(b.id));
    lateActiveBorrows().forEach(b=>notifReadLate.add(b.id));
    calibAlertItems().forEach(e=>notifReadCalib.add(e.id));
    await persistNotifReadState();
    await stSet('notif:seeded', true, false);
  }
}
async function persistNotifReadState(){
  await stSet('notif:readBorrows', Array.from(notifReadBorrows), false);
  await stSet('notif:readLate', Array.from(notifReadLate), false);
  await stSet('notif:readCalib', Array.from(notifReadCalib), false);
}
function unreadNewBorrows(){
  return state.borrows
    .filter(b=>!notifReadBorrows.has(b.id))
    .sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
}
function unreadLateReturns(){
  return lateActiveBorrows().filter(b=>!notifReadLate.has(b.id));
}
// เครื่องมือที่ถึงกำหนด/ใกล้ถึงกำหนดสอบเทียบภายใน 30 วัน (รวมที่เลยกำหนดแล้ว)
function calibAlertItems(){
  return state.equipment.filter(e=>{
    if(!e.nextCalib) return false;
    const days = calibDaysLeft(e.nextCalib);
    return days!==null && days<=30;
  }).sort((a,b)=> (a.nextCalib||'').localeCompare(b.nextCalib||''));
}
function unreadCalibAlerts(){
  return calibAlertItems().filter(e=>!notifReadCalib.has(e.id));
}
function notifUnreadCount(){ return unreadNewBorrows().length + unreadLateReturns().length + unreadCalibAlerts().length; }
function notifTimeAgo(iso){
  if(!iso) return '';
  const then = new Date(iso).getTime();
  if(isNaN(then)) return '';
  const diffSec = Math.max(0, Math.round((Date.now()-then)/1000));
  if(diffSec < 60) return 'เมื่อสักครู่';
  const diffMin = Math.round(diffSec/60);
  if(diffMin < 60) return `${diffMin} นาทีที่แล้ว`;
  const diffHr = Math.round(diffMin/60);
  if(diffHr < 24) return `${diffHr} ชั่วโมงที่แล้ว`;
  const diffDay = Math.round(diffHr/24);
  return `${diffDay} วันที่แล้ว`;
}
async function toggleNotifPanel(){
  state.notif.open = !state.notif.open;
  render();
}
async function markAllNotifRead(){
  state.borrows.forEach(b=>notifReadBorrows.add(b.id));
  lateActiveBorrows().forEach(b=>notifReadLate.add(b.id));
  calibAlertItems().forEach(e=>notifReadCalib.add(e.id));
  await persistNotifReadState();
  render();
}
async function openNotifItem(type, id){
  if(type==='new'){ notifReadBorrows.add(id); }
  else if(type==='late'){ notifReadLate.add(id); }
  else if(type==='calib'){ notifReadCalib.add(id); }
  await persistNotifReadState();
  state.notif.open = false;
  if(type==='calib'){
    if(!state.loggedIn){ render(); return; }
    state.tab = 'manage';
    state.manage.view = 'calib';
    const e = state.equipment.find(x=>x.id===id);
    if(e){
      state.manage.calib = state.manage.calib || {catFilter:'', statusFilter:'', search:''};
      state.manage.calib.search = e.assetCode || e.name || '';
    }
    render();
    return;
  }
  const b = state.borrows.find(x=>x.id===id);
  if(!state.loggedIn){ render(); return; }
  state.tab = 'return';
  state.returnSubTab = type==='late' ? 'late' : 'all';
  state.returnSearch = b ? (b.code || '') : '';

function beYear(y){ return y + 543; }
// แปลง Date -> "YYYY-MM-DD" โดยใช้เวลาท้องถิ่น (ห้ามใช้ toISOString() เพราะจะแปลงเป็น UTC
// ซึ่งในโซนเวลาไทย (+7) จะทำให้เที่ยงคืนของวันนั้นๆ กลายเป็นวันก่อนหน้าใน UTC -> วันที่เพี้ยนไป 1 วัน)
function toLocalISODate(d){
  if(!(d instanceof Date) || isNaN(d)) return null;
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
// ตรวจว่าสตริงเป็นวันที่รูปแบบ ISO (YYYY-MM-DD) ที่ถูกต้องจริงหรือไม่
// ใช้ป้องกันไม่ให้ค่าที่เพี้ยน (เช่น "20261-08-1" จากข้อมูลเก่าที่เสียหาย) หลุดไปแสดงผลตรงๆ
function isValidISODate(s){
  if(!s || typeof s !== 'string') return false;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  const d = new Date(s+'T00:00:00');
  return !isNaN(d) && toLocalISODate(d)===s;
}
// พยายามกู้วันที่จากสตริงที่เพี้ยน โดยดึงเฉพาะตัวเลขทั้งหมดแล้วตีความเป็น YYYYMMDD
// คืนค่า Date ที่ถูกต้อง หรือ null ถ้ากู้ไม่ได้
function salvageDateDigits(s){
  if(!s) return null;
  const digits = String(s).replace(/\D/g,'');
  if(digits.length<8) return null;
  const y = parseInt(digits.slice(0,4),10);
  const mo = parseInt(digits.slice(4,6),10);
  const da = parseInt(digits.slice(6,8),10);
  if(y<1900||y>2200||mo<1||mo>12||da<1||da>31) return null;
  const d = new Date(y, mo-1, da);
  return isNaN(d) ? null : d;
}
// ซ่อมรายการเครื่องมือที่ lastCalib/nextCalib เพี้ยนรูปแบบ (ไม่ใช่ YYYY-MM-DD ที่ถูกต้อง)
// คำนวณ nextCalib ใหม่จาก lastCalib (ถ้ากู้ได้) + รอบสอบเทียบ ให้ถูกต้องเสมอ
async function repairCalibDates(){
  let fixedCount = 0;
  const details = [];
  state.equipment.forEach(e=>{
    let changed = false;
    // normalize calibCycle ให้เป็นตัวเลขจริงเสมอ (ป้องกันบั๊กปีเพี้ยนจากการต่อสตริง เช่น 2026+"1"="20261")
    if(e.calibCycle!=null && typeof e.calibCycle !== 'number'){
      const n = parseInt(e.calibCycle,10);
      e.calibCycle = isNaN(n) ? 1 : n;
      changed = true;
    }
    let last = e.lastCalib ? e.lastCalib.slice(0,10) : null;
    if(last && !isValidISODate(last)){
      const salvaged = salvageDateDigits(last);
      const before = e.lastCalib;
      e.lastCalib = salvaged ? toLocalISODate(salvaged) : null;
      changed = true;
      details.push(`${e.name} (${e.assetCode||'-'}): สอบเทียบล่าสุด "${before}" → "${e.lastCalib||'-'}"`);
    }
    let next = e.nextCalib ? e.nextCalib.slice(0,10) : null;
    if(next && !isValidISODate(next)){
      const before = e.nextCalib;
      if(e.lastCalib && isValidISODate(e.lastCalib)){
        const cycle = parseInt(e.calibCycle,10) || 1;
        const d = new Date(e.lastCalib+'T00:00:00');
        d.setFullYear(d.getFullYear()+cycle);
        e.nextCalib = toLocalISODate(d);
      } else {
        const salvaged = salvageDateDigits(next);
        e.nextCalib = salvaged ? toLocalISODate(salvaged) : null;
      }
      changed = true;
      details.push(`${e.name} (${e.assetCode||'-'}): สอบเทียบครั้งถัดไป "${before}" → "${e.nextCalib||'-'}"`);
    }
    if(changed) fixedCount++;
  });
  if(fixedCount===0){ alert('ไม่พบวันที่ที่ผิดรูปแบบในระบบ'); return; }
  await saveEquipment();
  render();
  alert(`ซ่อมข้อมูลวันที่สำเร็จ ${fixedCount} รายการ:\n\n${details.join('\n')}`);
}
function fmtDateBE(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return `${d.getDate()} ${THAI_MONTHS[d.getMonth()]} ${beYear(d.getFullYear())}`;
}
function fmtDateShort(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${beYear(d.getFullYear())}`;
}
function fmtDateShortCE(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
// รูปแบบย่อแบบตารางแผนการสอบเทียบ: "3 เม.ย. 68"
function fmtDateBEShort2(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return `${d.getDate()} ${THAI_MONTHS_SHORT[d.getMonth()]} ${String(beYear(d.getFullYear())).slice(-2)}`;
}
// รูปแบบย่อ "เดือน ปี" แบบตารางแผนการสอบเทียบ: "เม.ย. 69"
function fmtMonthYearBEShort(iso){
  if(!iso) return '-';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return `${THAI_MONTHS_SHORT[d.getMonth()]} ${String(beYear(d.getFullYear())).slice(-2)}`;
}
// รวมข้อความ "ยี่ห้อ ... รุ่น ... S/N ..." สำหรับรายละเอียดพัสดุ
function equipDetailLine(e){

}
function nowTimeStr(){

}
function todayISO(){

}
function uid(prefix){ return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

/* ===================== Data init ===================== */
/* ===================== Migration: สถานะ 'auto-returned' รุ่นเก่า =====================
   เวอร์ชันก่อนหน้าของระบบเคยมีฟีเจอร์ "ปิดใบยืมอัตโนมัติ" ที่ตั้งสถานะเป็น 'auto-returned'
   ปัจจุบันฟีเจอร์นี้ถูกถอดออกแล้ว (ต้องกดคืนเองเสมอ) แต่ข้อมูลเก่าที่เคยถูกปิดแบบนี้
   อาจยังค้างอยู่ใน Firestore — โค้ดส่วนนี้จะดึงกลับมาเป็น 'active' ให้อัตโนมัติทุกครั้งที่โหลดระบบ
   เพื่อให้ใบยืมเหล่านั้นกลับไปคำนวณสถานะ (ค้าง/สาย ฯลฯ) ตามจริงอีกครั้ง
====================================================================================== */
async function migrateLegacyAutoReturned(){
  let migrated = false;
  state.borrows.forEach(b=>{
    if(b.status === 'auto-returned'){
      b.status = 'active';
      delete b.autoReturnedAt;
      delete b.actualReturnedAt;
      (b.itemsExpanded||[]).forEach(rec=>{ rec.returned = false; delete rec.returnedAt; });
      migrated = true;
    }
  });
  if(migrated) await saveBorrows();
}

async function initData(){
  let eq = await stGet('equipment:list', true);
  if(!eq || !Array.isArray(eq) || eq.length===0){
    eq = EQUIPMENT_SEED.map(e=>({...e}));
    await stSet('equipment:list', eq, true);
  }
  state.equipment = eq;
  {
    const calibChanged = autoUpdateCalibStatus();
    const orderChanged = ensureEquipOrder();
    if(calibChanged || orderChanged){ await saveEquipment(); }
  }

  let br = await stGet('borrows:list', true);
  if(!br || !Array.isArray(br)) br = [];
  state.borrows = br;

  await migrateLegacyAutoReturned();

  let rt = await stGet('returns:list', true);
  if(!rt || !Array.isArray(rt)) rt = [];
  state.returns = rt;

  await loadNotifReadState();

  let theme = await stGet('ui:theme', false);
  if(theme) state.theme = theme;
  applyTheme();

  const savedAuth = await stGet('auth:session', false);
  if(savedAuth && savedAuth.loggedIn){
    state.loggedIn = true;
    state.loggedInUser = savedAuth.user || null;
  }
}
async function saveEquipment(){ await stSet('equipment:list', state.equipment, true); }
async function saveBorrows(){ await stSet('borrows:list', state.borrows, true); }
async function saveReturns(){ await stSet('returns:list', state.returns, true); }

function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.theme);
}
async function toggleTheme(){
  state.theme = state.theme === 'light' ? 'dark' : 'light';
  applyTheme();
  await stSet('ui:theme', state.theme, false);
  render();
}

/* ===================== Availability logic ===================== */
// ตรวจว่าช่วงวันที่สองช่วงทับซ้อนกันหรือไม่ (แบบ inclusive, เทียบสตริง YYYY-MM-DD ได้ตรงๆ)
function dateRangesOverlap(startA, endA, startB, endB){
  if(!startA || !endA || !startB || !endB) return true; // ถ้าไม่มีข้อมูลวันที่ครบ ให้ถือว่าอาจทับซ้อน (ปลอดภัยไว้ก่อน)
  return startA <= endB && startB <= endA;
}
// เครื่องมือชิ้นนี้ถูกจอง/ถืออยู่ "ในช่วงวันที่ที่ต้องการยืม" หรือไม่
// (แทนที่ตรรกะเดิมที่เช็คแค่ "มีใบยืม active อยู่หรือเปล่า" โดยไม่สนวันที่เลย
//  ซึ่งทำให้ใบยืมที่จองวันในอนาคตไปแล้ว บล็อกใบยืมอื่นที่วันที่ไม่ได้ทับซ้อนกันจริง)
function unitIsHeldForRange(equipmentId, borrowDate, returnDate){
  for(const b of state.borrows){
    if(b.status !== 'active') continue;
    const list = (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : b.items;
    const usesUnit = list.some(it=> it.equipmentId === equipmentId && !it.returned);
    if(!usesUnit) continue;
    if(dateRangesOverlap(b.borrowDate, b.returnDate, borrowDate, returnDate)) return true;
  }
  return false;
}
// เผื่อเรียกโดยไม่ระบุช่วงวันที่ (เช่น หน้าจัดการเครื่องมือทั่วไป) — ใช้ "วันนี้" เป็นค่าเริ่มต้น
// เพื่อบอกว่าตอนนี้ ณ ขณะนี้ เครื่องมือถูกถืออยู่จริงหรือไม่
function unitIsHeld(equipmentId, borrowDate, returnDate){
  const bd = borrowDate || todayISO();
  const rd = returnDate || todayISO();
  return unitIsHeldForRange(equipmentId, bd, rd);
}

/* ===================== Per-item return tracking ===================== */
// Returns one row per item-name within a borrow, with per-unit return progress
function itemGroupsForBorrow(b){
  return (b.items||[]).map(it=>{
    const unitIds = (it.equipmentIds && it.equipmentIds.length) ? it.equipmentIds.slice() : (it.equipmentId? [it.equipmentId] : []);
    const returnedUnitIds = unitIds.filter(id=>{
      const rec = (b.itemsExpanded||[]).find(x=>x.equipmentId===id);
      return rec && rec.returned;
    });
    const remainingUnitIds = unitIds.filter(id=>!returnedUnitIds.includes(id));
    return {
      name: it.name, category: it.category, assetCode: it.assetCode, qty: it.qty,
      unitIds, returnedUnitIds, remainingUnitIds,
      returnedQty: returnedUnitIds.length, remainingQty: remainingUnitIds.length,
    };
  });
}
function borrowReturnedUnitCount(b){ return (b.itemsExpanded||[]).filter(x=>x.returned).length; }
function borrowTotalUnitCount(b){ return (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded.length : (b.items||[]).reduce((s,i)=>s+i.qty,0); }
function isBorrowFullyReturned(b){
  if(!b.itemsExpanded || !b.itemsExpanded.length) return false;
  return b.itemsExpanded.every(x=>x.returned);
}
function isBorrowPartiallyReturned(b){
  const c = borrowReturnedUnitCount(b);
  return c>0 && !isBorrowFullyReturned(b);
}
function borrowStatusBadge(b){
  if(b.status==='early-returned') return '<span class="pill pill-ok">↩️ คืนก่อนกำหนด</span>';
  if(b.status==='late-returned') return '<span class="pill pill-danger">⚠️ คืนสาย (เลยกำหนด)</span>';
  if(b.status==='returned') return '<span class="pill pill-ok">✅ คืนตรงเวลา</span>';
  if(isBorrowPartiallyReturned(b)) return `<span class="pill pill-warn">คืนบางส่วน (${borrowReturnedUnitCount(b)}/${borrowTotalUnitCount(b)})</span>`;
  if(b.status==='active' && borrowTimingCategory(b)==='late') return `<span class="pill pill-danger">⏰ เลยกำหนดคืนแล้ว ${daysLate(b)} วัน (ยังไม่คืน)</span>`;
  return '<span class="pill pill-ok">อนุมัติ/ใช้งานอยู่</span>';
}
function itemsSummaryLine(b){
  // one-line summary showing returned progress per item, e.g. "กล้อง x2 (คืนแล้ว 1), เชือก x1"
  return itemGroupsForBorrow(b).map(g=>{
    const extra = g.returnedQty>0 ? ` (คืนแล้ว ${g.returnedQty}/${g.qty})` : '';
    return esc(g.name)+' x'+g.qty+extra;
  }).join(', ');
}
function isCalibExpired(item){
  if(!item.nextCalib) return false;
  const today = todayISO();
  return item.nextCalib < today;
}
/* ===================== Auto-update สถานะใช้งาน ตามวันสอบเทียบครั้งถัดไป =====================
   ถ้าวันที่ "สอบเทียบครั้งถัดไป" (nextCalib) ของเครื่องมือ เกินวันที่ปัจจุบันแล้ว (เลยกำหนด)
   ระบบจะปรับ "สถานะใช้งาน" (useStatus) ของเครื่องมือชิ้นนั้นให้เป็น "รอสอบเทียบ" ให้อัตโนมัติทันที
====================================================================================== */
function autoUpdateCalibStatus(list){
  const today = todayISO();
  let changed = false;
  (list || state.equipment).forEach(item=>{
    if(item.nextCalib && item.nextCalib < today && item.useStatus !== 'รอสอบเทียบ'){
      item.useStatus = 'รอสอบเทียบ';
      changed = true;
    }
  });
  return changed;
}
function isReadyBorrowable(item, borrowDate, returnDate){
  return item.useStatus === 'ใช้งานได้' && !isCalibExpired(item) && !unitIsHeld(item.id, borrowDate, returnDate);
}
function isPendingCalibBorrowable(item, borrowDate, returnDate){
  if(unitIsHeld(item.id, borrowDate, returnDate)) return false;
  return item.useStatus === 'รอสอบเทียบ' || (item.useStatus === 'ใช้งานได้' && isCalibExpired(item));
}
function isBorrowable(item, borrowDate, returnDate){
  return isReadyBorrowable(item, borrowDate, returnDate) || isPendingCalibBorrowable(item, borrowDate, returnDate);
}
// group by category+name -> { readyItems (พร้อมใช้ ให้ยืมก่อน), pendingItems (รอสอบเทียบ ให้ยืมทีหลัง), availItems (รวม เรียงพร้อมใช้ก่อน) }
// borrowDate/returnDate = ช่วงวันที่ที่ต้องการยืม ถ้าไม่ส่งมาจะ default เป็น "วันนี้" (สถานะ ณ ปัจจุบัน)
function groupEquipment(category, borrowDate, returnDate){
  const groups = {};
  state.equipment.filter(e=>e.category===category).forEach(e=>{
    const key = e.name;
    if(!groups[key]) groups[key] = { name: e.name, category, items: [], readyItems: [], pendingItems: [], availItems: [] };
    groups[key].items.push(e);
    if(isReadyBorrowable(e, borrowDate, returnDate)) groups[key].readyItems.push(e);
    else if(isPendingCalibBorrowable(e, borrowDate, returnDate)) groups[key].pendingItems.push(e);
  });
  Object.values(groups).forEach(g=>{
    g.availItems = g.readyItems.concat(g.pendingItems);
    g.order = Math.min(...g.items.map(x=> (typeof x.order==='number') ? x.order : Infinity));
  });
  return Object.values(groups).sort((a,b)=>{
    if(a.order!==b.order) return a.order-b.order;
    return a.name.localeCompare(b.name,'th');
  });
}

// เรียงลำดับใหม่: ให้กลุ่มเครื่องมือ (ชื่อเดียวกัน) ในหมวดหมู่หนึ่ง ๆ เรียงตาม newOrderNames ที่แอดมินกำหนด
async function saveEquipmentOrder(category, newOrderNames){
  newOrderNames.forEach((name, idx)=>{
    state.equipment.forEach(e=>{
      if(e.category===category && e.name===name){ e.order = idx; }
    });
  });
  await saveEquipment();
}

async function moveEquipGroup(category, name, dir){
  const groups = groupEquipment(category);
  const idx = groups.findIndex(g=>g.name===name);
  const swapIdx = idx + dir;
  if(idx<0 || swapIdx<0 || swapIdx>=groups.length) return;
  const names = groups.map(g=>g.name);
  [names[idx], names[swapIdx]] = [names[swapIdx], names[idx]];
  await saveEquipmentOrder(category, names);
  render();
}

function nextOrderForCategory(cat){
  let max = -1;
  state.equipment.forEach(e=>{
    if(e.category===cat && typeof e.order==='number') max = Math.max(max, e.order);
  });
  return max+1;
}

// กำหนดค่า order เริ่มต้นให้เครื่องมือที่ยังไม่มีค่า (เรียกครั้งแรกหลังโหลดข้อมูล)
function ensureEquipOrder(){
  let changed = false;
  const seenInCat = {};
  state.equipment.forEach(e=>{
    if(typeof e.order !== 'number'){
      const key = e.category;
      if(seenInCat[key]===undefined) seenInCat[key] = 0;
      e.order = seenInCat[key]++;
      changed = true;
    } else {
      const key = e.category;
      seenInCat[key] = Math.max(seenInCat[key]||0, e.order+1);
    }
  });
  return changed;
}


function nextBorrowCode(dept){
  const prefix = dept;
  const count = state.borrows.filter(b=>b.dept===dept).length + 1;
  return `${prefix}-${String(count).padStart(4,'0')}/${beYear(new Date().getFullYear())}`;
}
function nextReturnCode(dept){
  const prefix = dept;
  const count = state.returns.filter(r=>r.dept===dept).length + 1;
  return `${prefix}-คส-${String(count).padStart(4,'0')}/${beYear(new Date().getFullYear())}`;
}

function renderNotifPanel(){
  const newBorrows = unreadNewBorrows();
  const lateReturns = unreadLateReturns();
  const calibDue = unreadCalibAlerts();
  const items = [
    ...newBorrows.map(b=>({ type:'new', b })),
    ...lateReturns.map(b=>({ type:'late', b })),
    ...calibDue.map(e=>({ type:'calib', e })),
  ].sort((x,y)=>{
    const tx = x.type==='new' ? (x.b.createdAt||'') : (x.type==='late' ? (x.b.returnDate||'') : (x.e.nextCalib||''));
    const ty = y.type==='new' ? (y.b.createdAt||'') : (y.type==='late' ? (y.b.returnDate||'') : (y.e.nextCalib||''));

      <span class="notif-panel-title">🔔 การแจ้งเตือน ${total>0?`(${total})`:''}</span>

            <div class="notif-icon late">⏰</div>
            <div class="notif-text">
              <div class="notif-title">ส่งคืนสาย: ${esc(b.code||'')}</div>

function openPartialReturn(id){
  const b = state.borrows.find(x=>x.id===id);
  if(!b) return;
  state.partialReturnId = id;
  // ค่าเริ่มต้น: เลือกทุกชิ้นที่ยังไม่คืนไว้ก่อน (กด "ยืนยันคืน" เฉยๆ = คืนทั้งหมดเหมือนเดิม)
  const sel = new Set();
  itemGroupsForBorrow(b).forEach(g=>g.remainingUnitIds.forEach(uid=>sel.add(uid)));
  state.partialReturnSelected = sel;
  render();
}
async function returnSelectedItems(id, unitIds){
  const b = state.borrows.find(x=>x.id===id);
  if(!b || !unitIds || !unitIds.length) return;
  const today = todayISO();
  (b.itemsExpanded||[]).forEach(rec=>{
    if(!rec.returned && unitIds.includes(rec.equipmentId)){ rec.returned = true; rec.returnedAt = today; }
  });
  if(isBorrowFullyReturned(b)){
    let newStatus;
    if(!b.returnDate || today < b.returnDate) newStatus = 'early-returned';
    else if(today === b.returnDate) newStatus = 'returned';
    else newStatus = 'late-returned';
    b.status = newStatus;
    b.actualReturnedAt = new Date().toISOString();
  }
  state.partialReturnId = null;
  state.partialReturnSelected = new Set();
  await saveBorrows();
  render();
}

  return {'ด้านน้ำ':'💧','ด้านอากาศ':'🌬️','ด้านฉุกเฉิน':'🚨','ด้านดิน':'🪨','คอมพิวเตอร์':'💻'}[c] || '🔧';
}

function printSlip(id){
  const b = state.borrows.find(x=>x.id===id);
  if(!b) return;
  document.getElementById('print-area').innerHTML = buildSlipHTML(b);
  document.body.classList.add('printing-slip');

  // ใส่เลขหน้ามุมขวาบน (เฉพาะตอนพิมพ์ใบยืม) ด้วย CSS @page margin box ล้วนๆ ไม่กระทบวิธีพิมพ์เดิม
  const pageNumStyle = document.createElement('style');
  pageNumStyle.id = 'slip-page-number-style';
  pageNumStyle.textContent = `@media print{
    @page{ margin-top:18mm; @top-right{ content: counter(page) "/" counter(pages); font-size:12pt; color:#666; font-family:sans-serif; vertical-align:bottom; padding-bottom:0; } }
    body.printing-slip .slip-page{ padding-top:6mm; }
  }`;
  document.head.appendChild(pageNumStyle);

  const doPrint = ()=>{
    // สองรอบ requestAnimationFrame เพื่อรอให้เบราว์เซอร์จัดเลย์เอาต์/ความกว้างคอลัมน์ของตาราง
    // ให้เสร็จก่อนสั่งพิมพ์ ไม่งั้นรอบแรกที่กดจะพิมพ์ด้วยเลย์เอาต์เก่าที่ยังไม่ถูกจัดใหม่
    // (คอลัมน์ตารางบีบจนข้อความตกบรรทัดเยอะ กลายเป็น 2 หน้า)
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        window.print();
        setTimeout(()=>{
          document.body.classList.remove('printing-slip');
          pageNumStyle.remove();
        }, 500);
      });
    });
  };

  // รอให้ฟอนต์ที่ใช้ในใบยืมโหลดเสร็จก่อน (ถ้าเบราว์เซอร์รองรับ) เพื่อกันปัญหาความกว้างตัวอักษร
  // เปลี่ยนหลังพิมพ์ไปแล้วในบางเครื่อง
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(doPrint).catch(doPrint);
  } else {
    doPrint();
  }
}

async function buildPDFDataUriFromHTML(html, css){
  if(!window.html2canvas || !window.jspdf) throw new Error('ไม่พบไลบรารีสร้าง PDF (html2canvas/jsPDF)');
  const { jsPDF } = window.jspdf;

  const container = document.createElement('div');
  container.style.position = 'fixed';
  container.style.left = '-99999px';
  container.style.top = '0';
  container.style.width = '210mm';
  container.style.background = '#ffffff';
  container.innerHTML = `<style>${css}</style>${html}`;
  document.body.appendChild(container);

  // รอให้ฟอนต์ TH Sarabun PSK โหลดเสร็จ + เลย์เอาต์เสถียรก่อนจับภาพ
  try{
    await Promise.all([
      document.fonts.load("400 16pt 'TH Sarabun PSK'"),
      document.fonts.load("700 16pt 'TH Sarabun PSK'"),
    ]);
    await document.fonts.ready;
  }catch(e){ /* ถ้าโหลดฟอนต์ไม่สำเร็จ จะ fallback ไปฟอนต์อื่นแทน */ }
  await new Promise(r=>setTimeout(r, 60));

  const PDF_PAGE_WIDTH_MM = 210, PDF_PAGE_HEIGHT_MM = 297, PDF_EXTRA_GAP_MM = 10; // ขนาด A4 + ระยะห่างพิเศษจากหัวกระดาษเมื่อถูกดันไปหน้าใหม่

  // ป้องกันไม่ให้แถวในตารางรายการเครื่องมือถูกตัด/ซ้อนกันข้ามหน้ากระดาษ -> ถ้าแถวไหนไม่พอ ดันทั้งแถวไปเริ่มหน้าใหม่
  try{
    const rows = Array.from(container.querySelectorAll('.slip-table tr'));
    for(const row of rows){
      const containerRect = container.getBoundingClientRect();
      const ratioMmPerPx = PDF_PAGE_WIDTH_MM / containerRect.width;
      const rowRect = row.getBoundingClientRect();
      const topMm = (rowRect.top - containerRect.top) * ratioMmPerPx;
      const bottomMm = (rowRect.bottom - containerRect.top) * ratioMmPerPx;
      for(let boundary = PDF_PAGE_HEIGHT_MM; boundary < bottomMm; boundary += PDF_PAGE_HEIGHT_MM){
        if(topMm < boundary && boundary < bottomMm){
          const gapPx = (boundary - topMm + PDF_EXTRA_GAP_MM) / ratioMmPerPx;
          const colCount = row.children.length || 1;
          const spacer = document.createElement('tr');
          spacer.innerHTML = `<td colspan="${colCount}" style="border:none; padding:0; height:${gapPx}px;"></td>`;
          row.parentNode.insertBefore(spacer, row);
          break;
        }
      }
    }
  }catch(e){ /* ถ้าคำนวณไม่ได้ ปล่อยผ่าน ใช้เลย์เอาต์ปกติ */ }

  // ป้องกันไม่ให้ส่วนลงชื่อ (sig-grid) ถูกตัดข้ามหน้ากระดาษ -> ถ้าไม่พอ ดันทั้งบล็อกไปหน้าถัดไป
  try{
    const sigEl = container.querySelector('.sig-grid');
    if(sigEl){
      const containerRect = container.getBoundingClientRect();
      const ratioMmPerPx = PDF_PAGE_WIDTH_MM / containerRect.width;
      const sigRect = sigEl.getBoundingClientRect();
      const topMm = (sigRect.top - containerRect.top) * ratioMmPerPx;
      const bottomMm = (sigRect.bottom - containerRect.top) * ratioMmPerPx;
      for(let boundary = PDF_PAGE_HEIGHT_MM; boundary < bottomMm; boundary += PDF_PAGE_HEIGHT_MM){
        if(topMm < boundary && boundary < bottomMm){
          const extraPx = (boundary - topMm + PDF_EXTRA_GAP_MM) / ratioMmPerPx;
          const currentMarginTop = parseFloat(getComputedStyle(sigEl).marginTop) || 0;
          sigEl.style.marginTop = (currentMarginTop + extraPx) + 'px';
          break;
        }
      }
    }
  }catch(e){ /* ถ้าคำนวณไม่ได้ ปล่อยผ่าน ใช้เลย์เอาต์ปกติ */ }

  let dataUri;
  try{
    const canvas = await html2canvas(container, { scale: 1.3, useCORS: true, backgroundColor: '#ffffff' });
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pageWidth = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth = pageWidth;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const imgData = canvas.toDataURL('image/jpeg', 0.72);

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    // ใส่เลขหน้าที่มุมขวาบนของทุกหน้า
    const totalPages = pdf.internal.getNumberOfPages();
    for(let p = 1; p <= totalPages; p++){
      pdf.setPage(p);
      pdf.setFontSize(10);
      pdf.setTextColor(80,80,80);
      pdf.text(`${p}/${totalPages}`, pageWidth - 10, 8, { align: 'right' });
    }

    dataUri = pdf.output('datauristring');
  } finally {
    document.body.removeChild(container);
  }
  return dataUri;
}
async function buildSlipPDFDataUri(b){
  return buildPDFDataUriFromHTML(buildSlipHTML(b), SLIP_STANDALONE_CSS);
}
function downloadSlipPDF(id){
  const b = state.borrows.find(x=>x.id===id);
  if(!b) return;
  buildSlipPDFDataUri(b).then(dataUri=>{
    const a = document.createElement('a');
    a.href = dataUri; a.download = pdfFileName(b);
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }).catch(err=>{
    alert('สร้างไฟล์ PDF ไม่สำเร็จ: ' + err.message);
  });
}
function dataUriToBlob(dataUri){
  const [header, base64] = dataUri.split(',');
  const mimeMatch = header.match(/data:(.*?);base64/);
  const mime = mimeMatch ? mimeMatch[1] : 'application/pdf';
  const bin = atob(base64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: mime});
}


async function uploadSlipPDFToCloudinary(b){
  if(!CLOUDINARY_READY) throw new Error('ยังไม่ได้ตั้งค่า Cloudinary (CLOUDINARY_CONFIG)');
  const pdfDataUri = await buildSlipPDFDataUri(b);
  const blob = dataUriToBlob(pdfDataUri);
  const form = new FormData();
  form.append('file', blob, pdfFileName(b));
  form.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
  form.append('public_id', `borrow-slips/${b.code.replace(/[\/\\]/g,'-')}-${Date.now()}`);
  const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/raw/upload`, {
    method: 'POST', body: form,
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('อัปโหลดไฟล์ขึ้น Cloudinary ไม่สำเร็จ: ' + t);
  }
  const data = await res.json();
  if(!data.secure_url) throw new Error('ไม่พบลิงก์ไฟล์จาก Cloudinary');
  return data.secure_url;
}

  setTimeout(()=>URL.revokeObjectURL(url), 2000);

function calibDaysLeft(nextCalib){
  if(!nextCalib) return null;
  const today = new Date(todayISO()+'T00:00:00');
  const next = new Date(nextCalib.slice(0,10)+'T00:00:00');
  return Math.round((next-today)/86400000);
}
function calibStatusInfo(nextCalib){
  const days = calibDaysLeft(nextCalib);
  if(days===null) return {cls:'', pill:'', label:'-'};
  if(days<0) return {cls:'calib-row-danger', pill:'pill-danger', label:`เลยกำหนด ${Math.abs(days)} วัน`};
  if(days<=90) return {cls:'calib-row-warn', pill:'pill-warn', label:`เหลือ ${days} วัน`};
  return {cls:'calib-row-ok', pill:'pill-ok', label:`เหลือ ${days} วัน`};
}

function renderCalendar(){
  const c = state.calendar;
  const first = new Date(c.year, c.month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(c.year, c.month+1, 0).getDate();
  const today = todayISO();
  // สำหรับแต่ละวันในเดือนนี้ ให้รวบรวม "ใบยืมทุกใบที่ช่วงวันยืม-คืนครอบคลุมวันนั้น"
  // (ไม่ใช่แค่ใบยืมที่เริ่มยืมวันนั้นวันเดียวเหมือนเดิม) เพื่อให้ admin เห็นภาพรวมว่าวันไหน
  // มีเครื่องมือถูกจอง/ถืออยู่บ้าง ตลอดทั้งช่วงที่ยืม ไม่ใช่แค่วันแรกที่สร้างใบยืม
  // แต่ละใบยืมในแต่ละวันจะถูกจัดกลุ่มเป็น 3 สถานะ:
  //   - "คืนแล้ว"  : ใบยืมนั้นถูกกดคืนไปแล้วจริง (status ไม่ใช่ active)
  //   - "ยืมอยู่"  : ใบยืม active และวันนั้นมาถึงแล้วหรือคือวันนี้ (ของจริงถูกถืออยู่/เคยถูกถืออยู่วันนั้น)
  //   - "จอง"     : ใบยืม active แต่วันนั้นยังไม่มาถึง (จองล่วงหน้าไว้ ยังไม่ได้มารับเครื่องมือ)
  const borrowsByDay = {};
  for(let d=1; d<=daysInMonth; d++){
    const dayISO = `${c.year}-${String(c.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayBorrows = state.borrows.filter(b=> b.borrowDate && b.returnDate && dateRangesOverlap(b.borrowDate, b.returnDate, dayISO, dayISO));
    if(dayBorrows.length) borrowsByDay[d] = dayBorrows.map(b=>{
      let cat = 'returned';
      if(b.status==='active') cat = (dayISO <= today) ? 'active' : 'reserved';
      return { b, cat };
    });
  }
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const items = borrowsByDay[d]||[];
    const activeN = items.filter(x=>x.cat==='active').length;
    const reservedN = items.filter(x=>x.cat==='reserved').length;
    const returnedN = items.filter(x=>x.cat==='returned').length;
    const cellCls = activeN>0 ? 'calday-active' : (reservedN>0 ? 'calday-reserved' : (returnedN>0 ? 'calday-returned' : ''));
    const isSel = c.selectedDay===d;
    cells += `<div class="cal-cell ${cellCls} ${isSel?'cal-sel':''}" data-act="cal-day" data-day="${d}">
      <div class="cal-daynum">${d}</div>
      ${items.length? `<div class="calday-badges">
        ${activeN? `<span class="calday-badge calday-badge-active">🔴 ยืมอยู่ ${activeN}</span>`:''}
        ${reservedN? `<span class="calday-badge calday-badge-reserved">🟡 จอง ${reservedN}</span>`:''}
        ${returnedN? `<span class="calday-badge calday-badge-returned">⚪ คืนแล้ว ${returnedN}</span>`:''}
      </div>`:''}
    </div>`;
  }
  const dayList = c.selectedDay ? (borrowsByDay[c.selectedDay]||[]) : [];
  return `
  <div class="card p-5">
    <div class="flex items-center justify-between mb-4">
      <button class="btn-ghost" data-act="cal-prev">‹ เดือนก่อน</button>
      <div class="font-bold text-lg">${THAI_MONTHS[c.month]} พ.ศ. ${beYear(c.year)}</div>
      <button class="btn-ghost" data-act="cal-next">เดือนถัดไป ›</button>
    </div>
    <p class="text-sm subtle mb-2">นับตลอดช่วงวันที่ยืม-คืนของทุกใบยืม ไม่ใช่แค่วันที่สร้างใบยืม — คลิกวันที่เพื่อดูรายละเอียด</p>
    <div class="avail-legend mb-3">
      <span><span class="avail-legend-dot" style="background:#f87171"></span>🔴 ยืมอยู่ (ถือเครื่องมืออยู่จริง)</span>
      <span><span class="avail-legend-dot" style="background:#fbbf24"></span>🟡 จอง (จองล่วงหน้า ยังไม่มารับ)</span>
      <span><span class="avail-legend-dot" style="background:#cbd5d1"></span>⚪ คืนแล้ว</span>
    </div>
    <div class="cal-grid cal-grid-head">
      ${['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="cal-headcell">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells}</div>
  </div>
  ${c.selectedDay? `
  <div class="card p-5 mt-4">
    <h3 class="font-bold mb-3">รายการที่มีเครื่องมือถูกจอง/ยืมในวันที่ ${c.selectedDay} ${THAI_MONTHS[c.month]} พ.ศ. ${beYear(c.year)}</h3>
    ${dayList.length===0? `<div class="empty-hint">ไม่มีรายการในวันนี้</div>` : dayList.map(x=>{ const b=x.b; return `
      <div class="borrow-item-card">
        <div class="flex justify-between flex-wrap gap-2">
          <div>
            <div class="font-bold">${b.code} — ${esc(b.name)} (${esc(b.dept)})</div>
            <div class="text-sm subtle">ยืม ${fmtDateBE(b.borrowDate)} ถึง ${fmtDateBE(b.returnDate)} • พื้นที่: ${esc(b.province)}</div>
            <div class="text-sm subtle">รายการ: ${itemsSummaryLine(b)}</div>
            <div class="text-xs mt-1">${borrowStatusBadge(b)}</div>
          </div>
          <div class="flex gap-2 items-start">
            <button class="btn-ghost" data-act="print-slip" data-id="${b.id}">🖨️ พิมพ์</button>
            ${b.status==='active' ? `<button class="btn-early-return" data-act="return-now" data-id="${b.id}">📦 คืนเครื่องมือ</button>` : ''}
          </div>
        </div>
      </div>`;}).join('')}
  </div>` : ''}
  `;
}

/* ===================== ปฏิทินสถานะการจอง/ยืม ต่อรายการเครื่องมือ (public, ไม่ต้องล็อกอิน) =====================
   ให้ user ทั่วไปเห็นว่าเครื่องมือแต่ละชื่อ มีวันไหนที่ถูกจอง/ยืมไปแล้วบ้าง ก่อนกรอกใบยืม
   หมายเหตุด้านความเป็นส่วนตัว: หน้าจอนี้เปิดให้บุคคลทั่วไปดูได้โดยไม่ต้องล็อกอิน จึงแสดงเฉพาะ
   "จำนวนว่าง/ไม่ว่างรวม" ต่อวันเท่านั้น ไม่แสดงชื่อ-เบอร์โทร-หน่วยงานของผู้ยืมคนอื่น
   (ถ้าล็อกอินเป็นเจ้าหน้าที่อยู่แล้ว จะเห็นรายละเอียดใบยืมเพิ่มเติมเมื่อกดที่วันนั้นๆ) */
function openAvailabilityCalendar(cat, name){
  const f = state.form;
  const base = f.borrowDate || todayISO();
  const d = new Date(base+'T00:00:00');
  state.availCal = { cat, name, year: d.getFullYear(), month: d.getMonth(), selectedDay: null };
  render();
}
function availCalShift(dir){
  const c = state.availCal;
  if(!c) return;
  let m = c.month + dir, y = c.year;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  c.month = m; c.year = y; c.selectedDay = null;
  render();
}
function unitsForToolName(cat, name){
  return state.equipment.filter(e=>e.category===cat && e.name===name);
}
function renderAvailabilityCalendarModal(){
  const c = state.availCal;
  if(!c) return '';
  const units = unitsForToolName(c.cat, c.name);
  const total = units.length;
  const first = new Date(c.year, c.month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(c.year, c.month+1, 0).getDate();

  function dayStats(dayISO){
    const bookedIds = units.filter(u=>unitIsHeldForRange(u.id, dayISO, dayISO)).map(u=>u.id);
    return { total, booked: bookedIds.length, free: total - bookedIds.length };
  }
  let cells = '';
  for(let i=0;i<startDow;i++) cells += `<div class="cal-cell cal-empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dayISO = `${c.year}-${String(c.month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const s = dayStats(dayISO);
    const cls = s.free<=0 ? 'avail-full' : (s.free<total ? 'avail-partial' : 'avail-free');
    const isSel = c.selectedDay===d;
    cells += `<div class="cal-cell ${cls} ${isSel?'cal-sel':''}" data-act="avail-cal-day" data-day="${d}">
      <div class="cal-daynum">${d}</div>
      <div class="avail-dot">ว่าง ${s.free}/${s.total}</div>
    </div>`;
  }

  let dayDetail = '';
  if(c.selectedDay){
    const dayISO = `${c.year}-${String(c.month+1).padStart(2,'0')}-${String(c.selectedDay).padStart(2,'0')}`;
    const s = dayStats(dayISO);
    dayDetail = `
    <div class="mt-4" style="border-top:1px solid var(--border); padding-top:14px;">
      <div class="font-bold mb-2">วันที่ ${c.selectedDay} ${THAI_MONTHS[c.month]} พ.ศ. ${beYear(c.year)}</div>
      <div class="text-sm subtle mb-2">ว่างให้ยืม ${s.free} จากทั้งหมด ${s.total} เครื่อง${s.booked>0? ` • ถูกจอง/ยืมอยู่ ${s.booked} เครื่อง`:''}</div>
      ${state.loggedIn ? renderAvailDayBorrowList(c.cat, c.name, dayISO) : (s.booked>0? `<div class="hint-be">เข้าสู่ระบบในฐานะเจ้าหน้าที่เพื่อดูรายละเอียดใบยืมที่จองวันนี้</div>` : '')}
    </div>`;
  }

  return `
  <div class="modal-backdrop" data-act="close-modal">
    <div class="modal-card">
      <div class="flex items-start justify-between gap-3 mb-1">
        <h3 class="text-lg font-bold">📅 คิวการจอง/ยืม — ${esc(c.name)}</h3>
        <button class="icon-btn" data-act="close-modal" title="ปิด">&times;</button>
      </div>
      <div class="text-sm subtle mb-4">มีทั้งหมด ${total} เครื่อง — เลือกวันในปฏิทินเพื่อดูจำนวนว่างของวันนั้น</div>
      <div class="flex items-center justify-between mb-3">
        <button class="btn-ghost" data-act="avail-cal-prev">‹ เดือนก่อน</button>
        <div class="font-bold">${THAI_MONTHS[c.month]} พ.ศ. ${beYear(c.year)}</div>
        <button class="btn-ghost" data-act="avail-cal-next">เดือนถัดไป ›</button>
      </div>
      <div class="cal-grid cal-grid-head">
        ${['อา','จ','อ','พ','พฤ','ศ','ส'].map(d=>`<div class="cal-headcell">${d}</div>`).join('')}
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="avail-legend mt-3">
        <span><span class="avail-legend-dot" style="background:#6ee7b7"></span>ว่างทั้งหมด</span>
        <span><span class="avail-legend-dot" style="background:#fcd34d"></span>ว่างบางส่วน</span>
        <span><span class="avail-legend-dot" style="background:#fca5a5"></span>เต็ม/ไม่ว่าง</span>
      </div>
      ${dayDetail}
    </div>
  </div>`;
}
// รายละเอียดใบยืมที่จองวันนั้น — แสดงเฉพาะกับผู้ที่ล็อกอินแล้ว (เจ้าหน้าที่) เพื่อไม่ให้บุคคลทั่วไปเห็นข้อมูลผู้ยืมคนอื่น
function renderAvailDayBorrowList(cat, name, dayISO){
  const units = unitsForToolName(cat, name);
  const unitIds = new Set(units.map(u=>u.id));
  const matches = state.borrows.filter(b=>{
    if(b.status!=='active') return false;
    if(!dateRangesOverlap(b.borrowDate, b.returnDate, dayISO, dayISO)) return false;
    const list = (b.itemsExpanded && b.itemsExpanded.length) ? b.itemsExpanded : b.items;
    return list.some(it=>unitIds.has(it.equipmentId) && !it.returned);
  });
  if(!matches.length) return `<div class="hint-be">ไม่มีใบยืมในวันนี้</div>`;
  return matches.map(b=>`
    <div class="borrow-item-card">
      <div class="font-bold">${esc(b.code)} — ${esc(b.dept)}</div>
      <div class="text-sm subtle">ยืม ${fmtDateBE(b.borrowDate)} ถึง ${fmtDateBE(b.returnDate)}</div>
    </div>`).join('');
}

function fiscalRange(fyBE){
  const gy = fyBE - 543;
  return { start: `${gy-1}-10-01`, end: `${gy}-09-30` };
}
function halfRange(mode, fyBE){
  const gy = fyBE - 543;
  if(mode==='oct-mar') return { start: `${gy-1}-10-01`, end: `${gy}-03-31` };
  return { start: `${gy}-04-01`, end: `${gy}-09-30` };
}
function monthRange(monthIdx, gy){
  const start = toLocalISODate(new Date(gy, monthIdx, 1));
  const end = toLocalISODate(new Date(gy, monthIdx+1, 0));
  return {start, end};
}
function weekRange(startISO){
  const s = new Date(startISO+'T00:00:00');
  const e = new Date(s); e.setDate(e.getDate()+6);
  return { start: startISO, end: toLocalISODate(e) };
}
function getReportRange(){
  const r = state.reports;
  if(r.mode==='week') return r.weekStart? weekRange(r.weekStart) : weekRange(todayISO());
  if(r.mode==='month') return monthRange(r.month, r.year);
  if(r.mode==='half') return halfRange(r.half, r.fy);
  if(r.mode==='fy') return fiscalRange(r.fy);
  return monthRange(new Date().getMonth(), new Date().getFullYear());
}
// ช่วงเวลาก่อนหน้า (ความยาวเท่ากับช่วงปัจจุบัน) ใช้สำหรับเปรียบเทียบ % เปลี่ยนแปลง
function getPreviousRange(range){
  const s = new Date(range.start+'T00:00:00');
  const e = new Date(range.end+'T00:00:00');
  const lengthDays = Math.round((e-s)/86400000);
  const prevEnd = new Date(s); prevEnd.setDate(prevEnd.getDate()-1);
  const prevStart = new Date(prevEnd); prevStart.setDate(prevStart.getDate()-lengthDays);
  return { start: toLocalISODate(prevStart), end: toLocalISODate(prevEnd) };
}
function filterBorrowsByRange(range){
  return state.borrows.filter(b=> b.borrowDate>=range.start && b.borrowDate<=range.end);
}
// ตัวกรองรายงาน: หน่วยงาน / จังหวัด / ประเภทเครื่องมือ (เลือกได้หลายอัน, ว่าง = ไม่กรอง)
function applyReportFilters(list){
  const r = state.reports;
  const depts = r.filterDepts||[], provs = r.filterProvinces||[], cats = r.filterCategories||[];
  return list.filter(b=>{
    if(depts.length && !depts.includes(b.dept)) return false;
    if(provs.length && !provs.includes(b.province)) return false;
    if(cats.length && !(b.items||[]).some(it=>cats.includes(it.category))) return false;
    return true;
  });
}
function reportItemMatchesCatFilter(category){
  const cats = state.reports.filterCategories||[];
  return !cats.length || cats.includes(category);
}
function toggleReportFilter(type, value){
  const key = type==='dept'?'filterDepts': type==='province'?'filterProvinces':'filterCategories';
  const arr = state.reports[key];
  const i = arr.indexOf(value);
  if(i>=0) arr.splice(i,1); else arr.push(value);
  render();
}
function clearReportFilters(){
  state.reports.filterDepts = []; state.reports.filterProvinces = []; state.reports.filterCategories = [];
  state.reports.openFilterDropdown = null;
  render();
}
async function clearDashboardData(){
  const ok1 = confirm('ยืนยันล้างข้อมูล Dashboard?\n\nการดำเนินการนี้จะลบ "ใบยืมทั้งหมด" ที่ใช้แสดงรายงาน/สถิติออกจากระบบถาวร (รายชื่อเครื่องมือในคลังจะไม่ถูกลบ)');
  if(!ok1) return;
  const ok2 = confirm('ยืนยันอีกครั้ง: ข้อมูลใบยืมทั้งหมดจะถูกลบและกู้คืนไม่ได้ ต้องการดำเนินการต่อหรือไม่?');
  if(!ok2) return;
  state.borrows = [];
  state.returns = [];
  await saveBorrows();
  await saveReturns();
  clearReportFilters();
  render();
}

function renderFormSearchSelect(ftype, label, options, value, placeholder){

    ${isOpen ? `

      <div class="ms-dropdown-list">
        ${filteredOptions.length===0 ? `<div class="ms-dropdown-empty">ไม่พบรายการที่ค้นหา</div>` : filteredOptions.map(o=>`
        <div class="ms-dropdown-item" data-act="select-form-dropdown-item" data-ftype="${ftype}" data-fval="${escAttr(o)}">

function renderFilterDropdown(ftype, label, options, selected, iconFn){
  const isOpen = state.reports.openFilterDropdown === ftype;
  const btnText = selected.length ? `เลือกแล้ว ${selected.length} รายการ` : 'ทั้งหมด (ไม่กรอง)';
  const searchVal = state.reports.filterSearch[ftype] || '';

  return `

    <button type="button" class="ms-dropdown-btn ${isOpen?'ms-dropdown-btn-open':''}" data-act="toggle-filter-dropdown" data-ftype="${ftype}">
      <span>${esc(btnText)}</span>

    </button>
    ${isOpen ? `
    <div class="ms-dropdown-panel">

      <div class="ms-dropdown-list">
        ${filteredOptions.length===0 ? `<div class="ms-dropdown-empty">ไม่พบรายการที่ค้นหา</div>` : filteredOptions.map(o=>`

          <input type="checkbox" data-act="toggle-report-filter" data-ftype="${ftype}" data-fval="${escAttr(o)}" ${selected.includes(o)?'checked':''}/>
          <span>${iconFn?iconFn(o):''}${esc(o)}</span>
        </label>`).join('')}
