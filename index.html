}
function renderReportsTab(){
  const range = getReportRange();
  const list = applyReportFilters(filterBorrowsByRange(range));
  const byEquip = {}, byDept = {}, byCat = {}, equipCat = {}, byProvince = {}, byProvinceBorrows = {};
  let totalQty = 0, returnedCount = 0, lateReturnedCount = 0;
  list.forEach(b=>{
    if(b.status==='returned' || b.status==='late-returned' || b.status==='early-returned') returnedCount++;
    if(b.status==='late-returned') lateReturnedCount++;
    const prov = b.province || 'ไม่ระบุ';
    byProvinceBorrows[prov] = (byProvinceBorrows[prov]||0) + 1;
    b.items.forEach(it=>{
      if(!reportItemMatchesCatFilter(it.category)) return;
      byDept[b.dept] = (byDept[b.dept]||0) + it.qty;
      byEquip[it.name] = (byEquip[it.name]||0) + it.qty;
      byCat[it.category] = (byCat[it.category]||0) + it.qty;
      equipCat[it.name] = it.category;
      byProvince[prov] = (byProvince[prov]||0) + it.qty;
      totalQty += it.qty;
    });
  });
  const equipEntries = Object.entries(byEquip).sort((a,b)=>b[1]-a[1]);
  const deptEntries = Object.entries(byDept).sort((a,b)=>b[1]-a[1]);
  const catEntries = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const provinceEntries = Object.entries(byProvinceBorrows).sort((a,b)=>b[1]-a[1]).map(([prov,borrowCount])=>[prov, borrowCount, byProvince[prov]||0]);
  const maxEquip = Math.max(1, ...equipEntries.map(e=>e[1]));
  const maxDept = Math.max(1, ...deptEntries.map(e=>e[1]));
  const activeCount = list.length - returnedCount;
  const onTimeCount = returnedCount - lateReturnedCount;
  const onTimeRate = returnedCount>0 ? (onTimeCount/returnedCount*100) : null;

  // เปรียบเทียบกับช่วงเวลาก่อนหน้า (ความยาวเท่ากัน)
  const prevRange = getPreviousRange(range);
  const prevList = applyReportFilters(filterBorrowsByRange(prevRange));
  let prevTotalQty = 0, prevReturnedCount = 0, prevLateReturnedCount = 0;
  prevList.forEach(b=>{
    if(b.status==='returned' || b.status==='late-returned' || b.status==='early-returned') prevReturnedCount++;
    if(b.status==='late-returned') prevLateReturnedCount++;
    b.items.forEach(it=>{
      if(!reportItemMatchesCatFilter(it.category)) return;
      prevTotalQty += it.qty;
    });
  });
  const prevActiveCount = prevList.length - prevReturnedCount;
  const prevOnTimeCount = prevReturnedCount - prevLateReturnedCount;
  const prevOnTimeRate = prevReturnedCount>0 ? (prevOnTimeCount/prevReturnedCount*100) : null;
  function pctDelta(cur, prev){
    if(prev===0 && cur===0) return null;
    if(prev===0) return null; // หลีกเลี่ยงหารด้วยศูนย์ / ค่าที่ไม่สื่อความหมาย
    return ((cur-prev)/prev*100);
  }
  const deltaBorrows = pctDelta(list.length, prevList.length);
  const deltaQty = pctDelta(totalQty, prevTotalQty);
  const deltaActive = pctDelta(activeCount, prevActiveCount);
  const deltaReturned = pctDelta(returnedCount, prevReturnedCount);
  const deltaOnTime = (onTimeRate!==null && prevOnTimeRate!==null) ? (onTimeRate-prevOnTimeRate) : null;
  function deltaBadge(delta, invert){
    if(delta===null || !isFinite(delta)) return '';
    const good = invert ? delta<0 : delta>0;
    const bad = invert ? delta>0 : delta<0;
    const color = good? '#15803d' : (bad? '#dc2626':'#6b7280');
    const arrow = delta>0?'▲':(delta<0?'▼':'—');
    return `<span style="color:${color};font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap">${arrow} ${Math.abs(delta).toFixed(0)}%</span>`;
  }
  function deltaPointBadge(delta){
    if(delta===null || !isFinite(delta)) return '';
    const color = delta>0? '#15803d' : (delta<0? '#dc2626':'#6b7280');
    const arrow = delta>0?'▲':(delta<0?'▼':'—');
    return `<span style="color:${color};font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap">${arrow} ${Math.abs(delta).toFixed(1)} จุด</span>`;
  }

  // เครื่องมือที่ไม่ถูกยืมเลยในช่วงเวลาที่เลือก (เทียบกับคลังทั้งหมด ตามตัวกรองประเภท/หน่วยงานถ้ามี)
  const catFilterSet = state.reports.filterCategories||[];
  const allToolNames = {};
  state.equipment.forEach(e=>{
    if(catFilterSet.length && !catFilterSet.includes(e.category)) return;
    const key = e.category+'|||'+e.name;
    if(!allToolNames[key]) allToolNames[key] = { category:e.category, name:e.name, total:0 };
    allToolNames[key].total++;
  });
  const underusedTools = Object.values(allToolNames)
    .filter(t=> !(byEquip[t.name] > 0))
    .sort((a,b)=>b.total-a.total)
    .slice(0,20);

  // ผู้ยืมที่คืนสายซ้ำ (นับจากใบยืมทั้งหมดในระบบ ไม่จำกัดเฉพาะช่วงเวลาที่เลือก เพื่อเห็นภาพพฤติกรรมสะสม)
  const lateByBorrower = {};
  applyReportFilters(state.borrows).forEach(b=>{
    const key = b.dept+'|||'+b.name;
    if(!lateByBorrower[key]) lateByBorrower[key] = { dept:b.dept, name:b.name, lateCount:0, totalCount:0 };
    lateByBorrower[key].totalCount++;
    if(b.status==='late-returned') lateByBorrower[key].lateCount++;
  });
  const repeatLateReturners = Object.values(lateByBorrower)
    .filter(x=>x.lateCount>=2)
    .sort((a,b)=>b.lateCount-a.lateCount)
    .slice(0,15);


  const deptDetail = {};
  list.forEach(b=>{
    if(!deptDetail[b.dept]) deptDetail[b.dept] = { items:{}, active:0, returned:0, lateReturned:0 };
    const dd = deptDetail[b.dept];
    if(b.status==='active') dd.active++;
    else if(b.status==='returned' || b.status==='early-returned') dd.returned++;
    else if(b.status==='late-returned') dd.lateReturned++;
    itemGroupsForBorrow(b).forEach(g=>{
      if(!reportItemMatchesCatFilter(g.category)) return;
      if(!dd.items[g.name]) dd.items[g.name] = { category: g.category, qty: 0, returnedQty: 0 };
      dd.items[g.name].qty += g.qty;
      dd.items[g.name].returnedQty += g.returnedQty;
    });
  });
  const deptDetailEntries = Object.entries(deptDetail).sort((a,b)=>(b[1].active+b[1].returned+b[1].lateReturned)-(a[1].active+a[1].returned+a[1].lateReturned));


  const trendMonths = [];
  const now = new Date();
  for(let i=5;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    trendMonths.push({ y:d.getFullYear(), m:d.getMonth(), label: THAI_MONTHS_SHORT[d.getMonth()]+' '+String(beYear(d.getFullYear())).slice(-2) });
  }
  const trendCounts = trendMonths.map(tm=>{
    return applyReportFilters(state.borrows).filter(b=>{
      const d = new Date(b.borrowDate+'T00:00:00');
      return !isNaN(d) && d.getFullYear()===tm.y && d.getMonth()===tm.m;
    }).length;
  });


  state._reportChartData = {
    catEntries, equipEntries: equipEntries.slice(0,8), equipCat,
    statusCounts: [activeCount, returnedCount],
    trendLabels: trendMonths.map(t=>t.label), trendCounts,
    deptStatusLabels: deptDetailEntries.map(e=>e[0]),
    deptStatusActive: deptDetailEntries.map(e=>e[1].active),
    deptStatusReturned: deptDetailEntries.map(e=>e[1].returned),
    deptStatusLateReturned: deptDetailEntries.map(e=>e[1].lateReturned),
    provinceLabels: provinceEntries.map(e=>e[0]),
    provinceBorrowCounts: provinceEntries.map(e=>e[1]),
    provinceQtyCounts: provinceEntries.map(e=>e[2]),
  };

  return `
  <div class="mt-5 space-y-6" id="report-root">
    <div class="report-print-title" style="display:none">รายงานสรุปการยืม-คืนเครื่องมือ<br/><span style="font-weight:600;font-size:13px;color:#5b6b68">พิมพ์เมื่อ ${new Date().toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})} • ช่วงข้อมูล: ${fmtDateBE(range.start)} — ${fmtDateBE(range.end)}</span></div>
    <div class="card p-5 no-print">
      <div class="flex flex-wrap gap-3 items-end">
        <div>
          <label class="lbl">ช่วงเวลา</label>
          <select id="r-mode" class="inp">
            <option value="week" ${state.reports.mode==='week'?'selected':''}>รายสัปดาห์</option>
            <option value="month" ${state.reports.mode==='month'?'selected':''}>รายเดือน</option>
            <option value="half" ${state.reports.mode==='half'?'selected':''}>ราย 6 เดือน</option>
            <option value="fy" ${state.reports.mode==='fy'?'selected':''}>รายปีงบประมาณ</option>
          </select>
        </div>
        ${state.reports.mode==='week' ? `
          <div><label class="lbl">วันเริ่มสัปดาห์</label><input type="date" id="r-week" class="inp" value="${state.reports.weekStart||todayISO()}"/></div>
        `:''}
        ${state.reports.mode==='month' ? `
          <div><label class="lbl">เดือน</label>
            <select id="r-month" class="inp">${THAI_MONTHS.map((m,i)=>`<option value="${i}" ${state.reports.month===i?'selected':''}>${m}</option>`).join('')}</select>
          </div>
          <div><label class="lbl">ปี พ.ศ.</label><input type="number" id="r-year" class="inp" value="${beYear(state.reports.year)}"/></div>

const _reportChartInstances = {};
function _destroyChart(key){
  if(_reportChartInstances[key]){ try{ _reportChartInstances[key].destroy(); }catch(e){} delete _reportChartInstances[key]; }
}
function downloadReportChart(key){
  const inst = _reportChartInstances[key];
  if(!inst) return;
  try{
    const url = inst.toBase64Image('image/png', 1);
    const a = document.createElement('a');
    a.href = url;
    a.download = `รายงาน-กราฟ-${key}-${todayISO()}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){ console.error(e); }
}
function drawReportCharts(){
  if(!window.Chart) return;
  const data = state._reportChartData;
  if(!data) return;
  if(window.ChartDataLabels) Chart.register(ChartDataLabels);
  const palette = ['#0891b2','#0ea5e9','#dc2626','#a16207','#7c3aed','#15803d','#db2777','#ea580c'];
  const isDark = document.documentElement.getAttribute('data-theme')==='dark';
  const fontColor = isDark ? '#eaf3f1' : '#16302b';
  Chart.defaults.font.family = "'Sarabun','Kanit',sans-serif";
  Chart.defaults.color = fontColor;
  Chart.defaults.set('plugins.datalabels', { display:false }); // ปิดไว้ก่อน แล้วเปิดเฉพาะกราฟที่ต้องการทีละอัน

  const catEl = document.getElementById('chart-cat');
  _destroyChart('cat');
  if(catEl && data.catEntries.length){
    _reportChartInstances.cat = new Chart(catEl, {
      type:'doughnut',
      data:{ labels:data.catEntries.map(e=>e[0]), datasets:[{ data:data.catEntries.map(e=>e[1]), backgroundColor:data.catEntries.map(e=>(CATEGORY_COLOR[e[0]]&&CATEGORY_COLOR[e[0]].bg)||'#64748b') }] },
      options:{ maintainAspectRatio:false, plugins:{
        legend:{ position:'bottom', labels:{boxWidth:10,font:{size:10}} },
        datalabels:{ display:true, color:'#fff', font:{weight:'700',size:11}, formatter:(v,ctx)=>{ const total=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0); const pct=total? (v/total*100):0; return pct<6? '' : v+'\n('+pct.toFixed(0)+'%)'; }, textAlign:'center' }
      } }
    });
  }

  const equipEl = document.getElementById('chart-equip');
  _destroyChart('equip');
  if(equipEl && data.equipEntries.length){
    _reportChartInstances.equip = new Chart(equipEl, {
      type:'bar',
      data:{ labels:data.equipEntries.map(e=>e[0].length>14?e[0].slice(0,14)+'…':e[0]), datasets:[{ label:'จำนวน', data:data.equipEntries.map(e=>e[1]), backgroundColor:data.equipEntries.map(e=>{const c=data.equipCat&&data.equipCat[e[0]];return (c&&CATEGORY_COLOR[c]&&CATEGORY_COLOR[c].bg)||'#0891b2';}) }] },
      options:{ maintainAspectRatio:false, indexAxis:'y', plugins:{
        legend:{display:false},
        datalabels:{ display:true, anchor:'end', align:'end', color:fontColor, font:{weight:'600',size:11}, formatter:v=>v }
      }, scales:{ x:{ ticks:{precision:0} } } }
    });
  }

  const statusEl = document.getElementById('chart-status');
  _destroyChart('status');
  if(statusEl && (data.statusCounts[0]+data.statusCounts[1])>0){
    _reportChartInstances.status = new Chart(statusEl, {
      type:'doughnut',
      data:{ labels:['กำลังยืมอยู่','คืนแล้ว'], datasets:[{ data:data.statusCounts, backgroundColor:['#b45309','#15803d'] }] },
      options:{ maintainAspectRatio:false, plugins:{
        legend:{ position:'bottom' },
        datalabels:{ display:true, color:'#fff', font:{weight:'700',size:12}, formatter:(v,ctx)=>{ const total=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0); const pct=total? (v/total*100):0; return v===0? '' : v+' ('+pct.toFixed(0)+'%)'; } }
      } }
    });
  }

  const trendEl = document.getElementById('chart-trend');
  _destroyChart('trend');
  if(trendEl){
    _reportChartInstances.trend = new Chart(trendEl, {
      type:'line',
      data:{ labels:data.trendLabels, datasets:[{ label:'จำนวนใบยืม', data:data.trendCounts, borderColor:'#0f766e', backgroundColor:'rgba(15,118,110,.15)', tension:.3, fill:true }] },
      options:{ maintainAspectRatio:false, plugins:{
        legend:{display:false},
        datalabels:{ display:true, align:'top', anchor:'end', color:'#0f766e', font:{weight:'700',size:11}, formatter:v=>v===0?'':v }
      }, scales:{ y:{ beginAtZero:true, ticks:{precision:0}, grace:'10%' } } }
    });
  }

  const deptStatusEl = document.getElementById('chart-dept-status');
  _destroyChart('deptStatus');
  if(deptStatusEl && data.deptStatusLabels && data.deptStatusLabels.length){
    _reportChartInstances.deptStatus = new Chart(deptStatusEl, {
      type:'bar',
      data:{
        labels: data.deptStatusLabels.map(l=>l.length>20?l.slice(0,20)+'…':l),
        datasets:[
          { label:'กำลังยืมอยู่', data:data.deptStatusActive, backgroundColor:'#b45309' },
          { label:'คืนแล้ว (ก่อน/ตรงเวลา)', data:data.deptStatusReturned, backgroundColor:'#15803d' },
          { label:'คืนสาย (เลยกำหนด)', data:data.deptStatusLateReturned, backgroundColor:'#dc2626' },
        ]
      },
      options:{ maintainAspectRatio:false, indexAxis:'y', plugins:{
        legend:{ position:'bottom' },

      }, scales:{ x:{ stacked:true, ticks:{precision:0} }, y:{ stacked:true } } }

  if(provinceEl && data.provinceLabels && data.provinceLabels.length){
    _reportChartInstances.province = new Chart(provinceEl, {

      data:{
        labels: data.provinceLabels.map(l=>l.length>18?l.slice(0,18)+'…':l),

      }, scales:{ x:{ ticks:{precision:0} } } }
    });

  drawExpandedChart(data, palette, fontColor);
}

function drawExpandedChart(data, palette, fontColor){

      options:{ maintainAspectRatio:false, plugins:{
        legend:{ position:'bottom', labels:{boxWidth:12,font:{size:13}} },
        datalabels:{ display:true, color:'#fff', font:{weight:'700',size:14}, formatter:(v,ctx)=>{ const total=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0); const pct=total? (v/total*100):0; return pct<6? '' : v+'\n('+pct.toFixed(0)+'%)'; }, textAlign:'center' }
      } } };
  } else if(key==='equip' && data.equipEntries.length){
    config = { type:'bar',
      data:{ labels:data.equipEntries.map(e=>e[0]), datasets:[{ label:'จำนวน', data:data.equipEntries.map(e=>e[1]), backgroundColor:data.equipEntries.map(e=>{const c=data.equipCat&&data.equipCat[e[0]];return (c&&CATEGORY_COLOR[c]&&CATEGORY_COLOR[c].bg)||'#0891b2';}) }] },
      options:{ maintainAspectRatio:false, indexAxis:'y', plugins:{

        datalabels:{ display:true, anchor:'end', align:'end', color:fontColor, font:{weight:'600',size:13}, formatter:v=>v }
      }, scales:{ x:{ ticks:{precision:0} } } } };
  } else if(key==='status' && (data.statusCounts[0]+data.statusCounts[1])>0){

      options:{ maintainAspectRatio:false, plugins:{
        legend:{ position:'bottom', labels:{font:{size:13}} },
        datalabels:{ display:true, color:'#fff', font:{weight:'700',size:15}, formatter:(v,ctx)=>{ const total=ctx.chart.data.datasets[0].data.reduce((a,b)=>a+b,0); const pct=total? (v/total*100):0; return v===0? '' : v+' ('+pct.toFixed(0)+'%)'; } }
      } } };
  } else if(key==='trend'){
    config = { type:'line',
      data:{ labels:data.trendLabels, datasets:[{ label:'จำนวนใบยืม', data:data.trendCounts, borderColor:'#0f766e', backgroundColor:'rgba(15,118,110,.15)', tension:.3, fill:true }] },
      options:{ maintainAspectRatio:false, plugins:{
        legend:{display:false},
        datalabels:{ display:true, align:'top', anchor:'end', color:'#0f766e', font:{weight:'700',size:13}, formatter:v=>v===0?'':v }
      }, scales:{ y:{ beginAtZero:true, ticks:{precision:0}, grace:'10%' } } } };
  } else if(key==='deptStatus' && data.deptStatusLabels && data.deptStatusLabels.length){
    config = { type:'bar',
      data:{
        labels: data.deptStatusLabels,
        datasets:[
          { label:'กำลังยืมอยู่', data:data.deptStatusActive, backgroundColor:'#b45309' },
          { label:'คืนแล้ว (ก่อน/ตรงเวลา)', data:data.deptStatusReturned, backgroundColor:'#15803d' },
          { label:'คืนสาย (เลยกำหนด)', data:data.deptStatusLateReturned, backgroundColor:'#dc2626' },
        ]
      },
      options:{ maintainAspectRatio:false, indexAxis:'y', plugins:{
        legend:{ position:'bottom', labels:{font:{size:13}} },
        datalabels:{ display:(ctx)=>ctx.dataset.data[ctx.dataIndex]>0, color:'#fff', font:{weight:'700',size:11} }
      }, scales:{ x:{ stacked:true, ticks:{precision:0} }, y:{ stacked:true } } } };
  } else if(key==='province' && data.provinceLabels && data.provinceLabels.length){
    config = { type:'bar',
      data:{
        labels: data.provinceLabels,
        datasets:[
          { label:'จำนวนใบยืม', data:data.provinceBorrowCounts, backgroundColor:'#0f766e' },
          { label:'จำนวนเครื่องมือ (ชิ้น)', data:data.provinceQtyCounts, backgroundColor:'#7c3aed' },
        ]
      },
      options:{ maintainAspectRatio:false, indexAxis:'y', plugins:{
        legend:{ position:'bottom', labels:{font:{size:13}} },
        datalabels:{ display:(ctx)=>ctx.dataset.data[ctx.dataIndex]>0, anchor:'end', align:'end', color:fontColor, font:{weight:'600',size:11} }
      }, scales:{ x:{ ticks:{precision:0} } } } };
  }

  if(config){
    _reportChartInstances.expand = new Chart(canvas, config);
  }
}


function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }

<script>

function attachHandlers(){
  root.querySelectorAll('[data-act]').forEach(el=>{
    if(el.tagName==='INPUT' && (el.type==='date'||el.type==='number'||el.type==='text')) return; // handled via change/input below
  });

  root.addEventListener('click', onClick);

  bindTextInput('form-search-province', v=>{state.form.dropdownSearch.province=v; render();});

  bindTextInput('cb-search', v=>{state.manage.calib.search=v; renderSoft();});

  bindTextInput('r-search-dept', v=>{state.reports.filterSearch.dept=v; renderSoft();});
  bindTextInput('r-search-province', v=>{state.reports.filterSearch.province=v; renderSoft();});

/* ===================== ลากจัดลำดับเครื่องมือแบบอิสระ (คล้ายจัดลำดับเพลย์ลิสต์) ===================== */
function onDragHandlePointerDown(e){
  if(e.button!==undefined && e.button!==0) return; // เฉพาะคลิกซ้าย/แตะ
  const handle = e.target.closest('.drag-handle');
  if(!handle) return;
  const row = handle.closest('.reorder-row');
  if(!row) return;
  e.preventDefault();
  const container = row.parentElement;
  const rowRect = row.getBoundingClientRect();
  dragCtx = {
    row, container,
    startY: e.clientY,
    baseTop: rowRect.top,      // ตำแหน่ง top ตอนเริ่มลาก (คงที่ตลอดการลาก ใช้อ้างอิงตำแหน่งที่ "ควรอยู่" ตามเมาส์/นิ้ว)
    curStaticTop: rowRect.top, // ตำแหน่ง top จริงในเลย์เอาต์ปัจจุบัน (อัปเดตทุกครั้งที่มีการสลับตำแหน่งกับแถวข้างเคียง)
    height: rowRect.height,
    cat: row.dataset.cat,
    lastDY: 0,
  };
  row.classList.add('dragging-row');
  try{ row.setPointerCapture(e.pointerId); }catch(err){}
  row.addEventListener('pointermove', onRowPointerMove);
  row.addEventListener('pointerup', onRowPointerUp);
  row.addEventListener('pointercancel', onRowPointerUp);
}
function onRowPointerMove(e){
  if(!dragCtx) return;
  dragCtx.lastDY = e.clientY - dragCtx.startY;
  if(dragRAF) return;
  dragRAF = requestAnimationFrame(updateDragFrame);
}
function updateDragFrame(){
  dragRAF = null;
  if(!dragCtx) return;
  const { row, container } = dragCtx;
  const desiredTop = dragCtx.baseTop + dragCtx.lastDY; // ตำแหน่งที่อยากให้แถวไปอยู่ ณ ตอนนี้ (ตามเมาส์)
  const desiredCenter = desiredTop + dragCtx.height/2;
  const rows = Array.from(container.querySelectorAll('.reorder-row'));
  const curIndex = rows.indexOf(row);

  if(curIndex>0){
    const prev = rows[curIndex-1];
    const prevRect = prev.getBoundingClientRect();
    if(desiredCenter < prevRect.top + prevRect.height/2){
      container.insertBefore(row, prev);
      dragCtx.curStaticTop -= prevRect.height;
      flipSibling(prev, prevRect);
      applyDragTransform();
      return;
    }
  }
  if(curIndex < rows.length-1){
    const next = rows[curIndex+1];
    const nextRect = next.getBoundingClientRect();
    if(desiredCenter > nextRect.top + nextRect.height/2){
      container.insertBefore(next, row);
      dragCtx.curStaticTop += nextRect.height;
      flipSibling(next, nextRect);
      applyDragTransform();
      return;
    }
  }
  applyDragTransform();
}
// ตั้งค่า transform ของแถวที่ลากอยู่ ให้ตำแหน่งที่ "แสดงผลจริง" (ตำแหน่งในเลย์เอาต์ + transform)
// เท่ากับตำแหน่งที่ต้องการ (desiredTop) เสมอ ไม่ว่าจะสลับตำแหน่งในลิสต์ไปกี่ครั้งก็ตาม — จึงไม่มีการกระตุก/กระโดด
function applyDragTransform(){
  const desiredTop = dragCtx.baseTop + dragCtx.lastDY;
  const transformY = desiredTop - dragCtx.curStaticTop;
  dragCtx.row.style.transform = `translateY(${transformY}px)`;
}
// FLIP animation: ทำให้แถวที่ถูกสลับตำแหน่ง เลื่อนแบบนุ่มนวลแทนการกระโดดทันที
function flipSibling(el, oldRect){
  const newRect = el.getBoundingClientRect();
  const delta = oldRect.top - newRect.top;
  if(!delta) return;
  el.style.transition = 'none';
  el.style.transform = `translateY(${delta}px)`;
  requestAnimationFrame(()=>{
    el.style.transition = 'transform 140ms ease';
    el.style.transform = '';
  });
}
async function onRowPointerUp(e){
  if(!dragCtx) return;
  const {row, container, cat} = dragCtx;
  if(dragRAF){ cancelAnimationFrame(dragRAF); dragRAF = null; }
  row.classList.remove('dragging-row');
  row.style.transform = '';
  row.removeEventListener('pointermove', onRowPointerMove);
  row.removeEventListener('pointerup', onRowPointerUp);
  row.removeEventListener('pointercancel', onRowPointerUp);
  try{ row.releasePointerCapture(e.pointerId); }catch(err){}
  const rows = Array.from(container.querySelectorAll('.reorder-row'));
  const newNames = rows.map(r=>r.dataset.name);
  dragCtx = null;
  await saveEquipmentOrder(cat, newNames);
  render();
}
function onDocumentClickCloseFilterDropdown(e){
  if(state.reports.openFilterDropdown && !e.target.closest('[data-dropdown]')){
    state.reports.openFilterDropdown = null;
    render();
    return;
  }
  if(state.form.openDropdown && !e.target.closest('[data-dropdown]')){
    state.form.openDropdown = null;
    render();
    return;
  }
  if(state.notif.open && !e.target.closest('[data-dropdown]') && !e.target.closest('.notif-wrap')){
    state.notif.open = false;
    render();
    return;
  }
}
function bindTextInput(id, setter){
  const el = document.getElementById(id);
  if(el) el.addEventListener('input', ()=>setter(el.value));
}
function bindEnterKey(id, onEnter){
  const el = document.getElementById(id);
  if(el) el.addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ e.preventDefault(); onEnter(); } });
}
function bindPhoneInput(id){
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('input', ()=>{
    const digitsOnly = el.value.replace(/[^0-9]/g,'');
    if(el.value !== digitsOnly) el.value = digitsOnly;
    state.form.phone = digitsOnly;
  });
}
function renderSoft(){ render(); }

function onClick(e){
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

 
  if(el.classList.contains('modal-backdrop') && e.target !== el) return;

  if(act==='tab'){ state.tab = el.dataset.tab; state.lastCreatedBorrowId=null; state.lastCreatedReturnId=null; render(); return; }
  if(act==='toggle-theme'){ toggleTheme(); return; }
  if(act==='logout'){ state.loggedIn=false; state.loggedInUser=null; state.notif.open=false; stSet('auth:session', null, false); render(); return; }
  if(act==='toggle-notif'){ toggleNotifPanel(); return; }
  if(act==='notif-mark-all'){ markAllNotifRead(); return; }
  if(act==='notif-open'){ openNotifItem(el.dataset.type, el.dataset.id); return; }
  if(act==='do-login'){ doLogin(); return; }
  if(act==='reset-form'){ resetForm(); render(); return; }
  if(act==='dismiss-banner'){ state.lastCreatedBorrowId=null; render(); return; }
  if(act==='toggle-cat'){ toggleCat(el.dataset.cat); render(); return; }
  if(act==='toggle-tool'){ toggleTool(el.dataset.cat, el.dataset.name); render(); return; }
  if(act==='submit-borrow'){ submitBorrow(); return; }
  if(act==='confirm-submit-borrow'){ confirmSubmitBorrow(); return; }
  if(act==='cancel-confirm-borrow'){ cancelConfirmBorrow(); return; }
  if(act==='print-slip'){ printSlip(el.dataset.id); return; }
  if(act==='download-slip'){ downloadSlip(el.dataset.id); return; }
  if(act==='download-slip-pdf'){ downloadSlipPDF(el.dataset.id); return; }
  if(act==='mailto-notify'){ notifyAdmin(el.dataset.id); return; }
  if(act==='mview'){ state.manage.view = el.dataset.v; render(); return; }
  if(act==='reorder-cat'){ state.manage.reorderCat = el.dataset.cat; render(); return; }
  if(act==='reorder-up'){ moveEquipGroup(el.dataset.cat, el.dataset.name, -1); return; }
  if(act==='reorder-down'){ moveEquipGroup(el.dataset.cat, el.dataset.name, 1); return; }
  if(act==='add-equip'){ state.manage.editing='new'; render(); return; }
  if(act==='edit-equip'){ state.manage.editing=el.dataset.id; render(); return; }
  if(act==='view-borrow'){ state.viewingBorrowId=el.dataset.id; render(); return; }
  if(act==='close-modal'){ state.manage.editing=null; state.viewingBorrowId=null; state.availCal=null; state.partialReturnId=null; state.partialReturnSelected=new Set(); state.expandedChart=null; render(); return; }
  if(act==='open-avail-cal'){ openAvailabilityCalendar(el.dataset.cat, el.dataset.name); return; }
  if(act==='avail-cal-prev'){ availCalShift(-1); return; }
  if(act==='avail-cal-next'){ availCalShift(1); return; }
  if(act==='avail-cal-day'){ state.availCal.selectedDay = parseInt(el.dataset.day); render(); return; }
  if(act==='save-equip'){ saveEquipModal(el.dataset.id); return; }
  if(act==='del-equip'){ delEquip(el.dataset.id); return; }
  if(act==='clear-equip'){ clearEquip(); return; }
  if(act==='repair-calib-dates'){ repairCalibDates(); return; }
  if(act==='calib-clear-selection'){ state.calibSelected.clear(); render(); return; }
  if(act==='calib-confirm-selected'){ state.calibConfirmIds = Array.from(state.calibSelected); render(); return; }
  if(act==='cancel-calib-confirm'){ state.calibConfirmIds = null; render(); return; }
  if(act==='confirm-calib-done'){
    const ids = state.calibConfirmIds || [];
    markCalibratedBulk(ids);
    ids.forEach(id=>state.calibSelected.delete(id));
    state.calibConfirmIds = null;
    return;
  }
  if(act==='cal-prev'){ calShift(-1); return; }
  if(act==='cal-next'){ calShift(1); return; }
  if(act==='cal-day'){ state.calendar.selectedDay = parseInt(el.dataset.day); render(); return; }
  if(act==='return-now'){ openPartialReturn(el.dataset.id); return; }
  if(act==='open-partial-return'){ openPartialReturn(el.dataset.id); return; }
  if(act==='partial-select-all'){
    const b = state.borrows.find(x=>x.id===el.dataset.id);
    if(b){ itemGroupsForBorrow(b).forEach(g=>g.remainingUnitIds.forEach(uid=>state.partialReturnSelected.add(uid))); render(); }
    return;
  }
  if(act==='partial-select-none'){ state.partialReturnSelected = new Set(); render(); return; }
  if(act==='partial-confirm-return'){
    const b = state.borrows.find(x=>x.id===el.dataset.id);
    const ids = Array.from(state.partialReturnSelected);
    if(!b || !ids.length) return;
    const allSelected = itemGroupsForBorrow(b).every(g=>g.remainingUnitIds.every(uid=>ids.includes(uid)));
    const label = allSelected ? `ทั้งหมด (${ids.length} ชิ้น)` : `บางส่วน (${ids.length} ชิ้น)`;
    if(!confirm(`ยืนยันคืนเครื่องมือ${label} สำหรับใบยืม ${b.code} (${b.name})?`)) return;
    returnSelectedItems(b.id, ids);
    return;
  }
  if(act==='return-subtab'){ state.returnSubTab = el.dataset.subtab; render(); return; }
  if(act==='dismiss-return-banner'){ state.lastCreatedReturnId=null; render(); return; }
  if(act==='export-excel'){ exportExcel(); return; }
  if(act==='print-report'){ printReport(); return; }
  if(act==='clear-report-filters'){ clearReportFilters(); return; }
  if(act==='clear-dashboard-data'){ clearDashboardData(); return; }
  if(act==='download-chart'){ downloadReportChart(el.dataset.chart); return; }
  if(act==='expand-chart'){ state.expandedChart = { key: el.dataset.chart, title: el.dataset.title||'' }; render(); return; }
  if(act==='toggle-filter-dropdown'){ const t=el.dataset.ftype; const wasOpen = state.reports.openFilterDropdown===t; state.reports.openFilterDropdown = wasOpen ? null : t; if(!wasOpen) state.reports.filterSearch[t] = ''; render(); return; }
  if(act==='toggle-report-filter'){ toggleReportFilter(el.dataset.ftype, el.dataset.fval); return; }
  if(act==='toggle-form-dropdown'){ const t=el.dataset.ftype; const wasOpen = state.form.openDropdown===t; state.form.openDropdown = wasOpen ? null : t; if(!wasOpen) state.form.dropdownSearch[t] = ''; render(); return; }
  if(act==='select-form-dropdown-item'){ const t=el.dataset.ftype; state.form[t] = el.dataset.fval; state.form.openDropdown = null; state.form.dropdownSearch[t] = ''; render(); return; }
}

function onChange(e){
  const el = e.target;
  const act = el.dataset && el.dataset.act;

  if(el.id==='f-borrowdate'){ state.form.borrowDate = el.value; render(); return; }
  if(el.id==='f-returndate'){ state.form.returnDate = el.value; render(); return; }

  if(act==='qty-tool'){ setQty(el.dataset.cat, el.dataset.name, parseInt(el.value)||1); return; }
  if(act==='edit-status'){ updateEquipField(el.dataset.id,'useStatus',el.value); return; }
  if(act==='edit-calib'){ updateCalibDate(el.dataset.id, el.value); return; }

  if(el.id==='m-cat'){ state.manage.catFilter = el.value; render(); return; }
  if(el.id==='m-status'){ state.manage.statusFilter = el.value; render(); return; }
  if(el.id==='cb-cat'){ state.manage.calib.catFilter = el.value; render(); return; }
  if(el.id==='cb-status'){ state.manage.calib.statusFilter = el.value; render(); return; }
  if(el.id==='calib-select-all'){
    const cm = state.manage.calib || {};
    let items = state.equipment.filter(x=>!!x.nextCalib);
    if(cm.catFilter) items = items.filter(x=>x.category===cm.catFilter);
    if(cm.search) items = items.filter(x=>(x.name+x.assetCode+x.brand+x.model).toLowerCase().includes(cm.search.toLowerCase()));
    items = items.map(x=>({...x, calibInfo:calibStatusInfo(x.nextCalib)}));
    if(cm.statusFilter==='danger') items = items.filter(x=>x.calibInfo.pill==='pill-danger');
    else if(cm.statusFilter==='warn') items = items.filter(x=>x.calibInfo.pill==='pill-warn');
    else if(cm.statusFilter==='ok') items = items.filter(x=>x.calibInfo.pill==='pill-ok');
    if(el.checked){ items.forEach(x=>state.calibSelected.add(x.id)); }
    else { items.forEach(x=>state.calibSelected.delete(x.id)); }
    render(); return;
  }
  if(el.classList && el.classList.contains('calib-row-check')){
    if(el.checked) state.calibSelected.add(el.dataset.id);
    else state.calibSelected.delete(el.dataset.id);
    renderSoft(); return;
  }
  if(el.classList && el.classList.contains('partial-return-check')){
    const uid = el.dataset.unit;
    if(el.checked) state.partialReturnSelected.add(uid);
    else state.partialReturnSelected.delete(uid);
    render(); return;
  }

  if(el.id==='import-file'){ importExcel(el.files[0]); return; }

  if(el.id==='r-mode'){ state.reports.mode = el.value; render(); return; }
  if(el.id==='r-week'){ state.reports.weekStart = el.value; render(); return; }
  if(el.id==='r-month'){ state.reports.month = parseInt(el.value); render(); return; }

function buildBorrowDraft(){
  const f = state.form;
  const nameEl = document.getElementById('f-name');
  const phoneEl = document.getElementById('f-phone');
  const posEl = document.getElementById('f-position');
  const noteEl = document.getElementById('f-notes');
  f.name = nameEl?nameEl.value:f.name;
  f.phone = phoneEl?phoneEl.value:f.phone;
  f.position = posEl?posEl.value:f.position;
  f.notes = noteEl?noteEl.value:f.notes;

  const errs = [];
  if(!f.dept) errs.push('กรุณาเลือกหน่วยงานผู้ยืม');
  if(!f.name) errs.push('กรุณากรอกชื่อ-นามสกุลผู้ยืม');
  if(!f.borrowDate) errs.push('กรุณาเลือกวันที่ยืม');
  if(!f.returnDate) errs.push('กรุณาเลือกวันที่คืน');
  if(f.borrowDate && f.returnDate && f.returnDate < f.borrowDate) errs.push('วันที่คืนต้องไม่ก่อนวันที่ยืม');
  if(!f.province) errs.push('กรุณาระบุพื้นที่ปฏิบัติงาน');
  if(!PROVINCES.includes(f.province)) errs.push('กรุณาเลือกจังหวัดจากรายการที่ค้นหา');
  const pickKeys = Object.keys(f.picks);
  if(pickKeys.length===0) errs.push('กรุณาเลือกเครื่องมืออย่างน้อย 1 รายการ');

  if(errs.length) return { errs };

  const items = [];
  for(const key of pickKeys){
    const lastSep = key.lastIndexOf('|');
    const name = key.slice(0,lastSep), cat = key.slice(lastSep+1);
    const qty = f.picks[key];
    const group = groupEquipment(cat, f.borrowDate, f.returnDate).find(g=>g.name===name);
    if(!group || group.availItems.length < qty){
      return { errs: [`เครื่องมือ "${name}" มีจำนวนว่างไม่พอสำหรับช่วงวันที่ ${fmtDateBE(f.borrowDate)} ถึง ${fmtDateBE(f.returnDate)} (ว่างจริง ${group?group.availItems.length:0} เครื่อง มีคนจองช่วงวันที่ทับซ้อนอยู่แล้ว)`] };
    }
    const chosen = group.availItems.slice(0, qty);
    chosen.forEach(u=>{
      items.push({ equipmentId: u.id, name: u.name, assetCode: u.assetCode, category: cat, qty: 1 });
    });
   
  }
  
  const grouped = {};
  items.forEach(it=>{
    if(!grouped[it.name]) grouped[it.name] = { name: it.name, assetCode: it.assetCode, category: it.category, qty: 0, unitIds: [] };
    grouped[it.name].qty += 1;
    grouped[it.name].unitIds.push(it.equipmentId);
    if(grouped[it.name].qty>1) grouped[it.name].assetCode = grouped[it.name].unitIds.map(id=>{
      const u = state.equipment.find(x=>x.id===id); return u?u.assetCode:'';
    }).join(', ');
  });
  const finalItems = Object.values(grouped).map(g=>({
    name: g.name, assetCode: g.assetCode, category: g.category, qty: g.qty,
    equipmentId: g.unitIds[0], equipmentIds: g.unitIds
  }));

  const now = new Date();
  const borrow = {
    id: uid('BR'),
    code: nextBorrowCode(f.dept),
    createdAt: now.toISOString(),
    createdTime: nowTimeStr(),
    dept: f.dept, name: f.name, phone: f.phone, position: f.position,
    borrowDate: f.borrowDate, returnDate: f.returnDate, province: f.province, notes: f.notes,
    items: finalItems.map(it=>({ equipmentId: it.equipmentId, equipmentIds: it.equipmentIds, name: it.name, assetCode: it.assetCode, category: it.category, qty: it.qty })),
    status: 'active',
  };

  borrow.itemsExpanded = [];
  finalItems.forEach(it=> it.equipmentIds.forEach(id=> borrow.itemsExpanded.push({equipmentId:id})));

  return { errs: [], borrow };
}

/* Excel import using SheetJS */
function importExcel(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array', cellDates:true});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:false});
      const header = rows[0];
      const newItems = [];
      const orderCounters = {};
      for(let i=1;i<rows.length;i++){
        const r = rows[i];
        if(!r || !r[1]) continue;
        const cat = r[0]||'';
        if(orderCounters[cat]===undefined) orderCounters[cat] = nextOrderForCategory(cat);
        newItems.push({
          id: uid('EQ'),
          category: cat, name: r[1]||'', dept: r[2]||'', yearGot: r[3]||'',
          condition: r[4]||'', calibStatus: r[5]||'', useStatus: r[6]||'ใช้งานได้',
          lastCalib: r[7]? excelDateToISO(r[7]) : null,
          calibCycle: parseInt(r[8],10)||1,
          nextCalib: r[9]? excelDateToISO(r[9]) : null,
          brand: r[10]||'', model: r[11]||'', serial: r[12]||'', assetCode: r[13]||'', params: r[14]||'',
          order: orderCounters[cat]++,
        });
      }
      if(newItems.length===0){ alert('ไม่พบข้อมูลเครื่องมือในไฟล์ที่นำเข้า'); return; }
      const merge = confirm(`พบเครื่องมือ ${newItems.length} รายการในไฟล์\n\nกด "ตกลง" เพื่อ "เพิ่มต่อ" ในฐานข้อมูลเดิม\nกด "ยกเลิก" เพื่อ "แทนที่" ฐานข้อมูลเดิมทั้งหมด`);
      if(merge) state.equipment = state.equipment.concat(newItems);
      else state.equipment = newItems;
      autoUpdateCalibStatus();
      await saveEquipment();
      render();
      alert('นำเข้าข้อมูลสำเร็จ');
    }catch(err){
      alert('เกิดข้อผิดพลาดในการอ่านไฟล์: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}
function excelDateToISO(v){
  if(!v) return null;
  if(v instanceof Date) return toLocalISODate(v);
  const s = String(v).trim();
  // รองรับรูปแบบ วัน/เดือน/ปี หรือ วัน-เดือน-ปี (เช่น 26/02/2026) ซึ่ง Excel/ผู้ใช้มักกรอกเป็นข้อความแบบไทย
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m){
    let [, dd, mm, yyyy] = m;
    dd = parseInt(dd,10); mm = parseInt(mm,10); yyyy = parseInt(yyyy,10);
    // ถ้าปีดูเหมือน พ.ศ. (มากกว่าปีปัจจุบัน ค.ศ. + 400) ให้แปลงเป็น ค.ศ.
    if(yyyy > 2400) yyyy -= 543;
    if(mm>=1 && mm<=12 && dd>=1 && dd<=31){
      const d = new Date(yyyy, mm-1, dd);
      if(!isNaN(d)) return toLocalISODate(d);
    }
  }
  // รองรับรูปแบบ ปี-เดือน-วัน (ISO) เช่น 2026-02-26
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m){
    let [, yyyy, mm, dd] = m;
    const d = new Date(parseInt(yyyy,10), parseInt(mm,10)-1, parseInt(dd,10));
    if(!isNaN(d)) return toLocalISODate(d);
  }
  // เผื่อกรณีอื่นๆ ที่ Excel ส่งมาเป็นเลข serial date หรือรูปแบบที่ JS อ่านได้ตรงๆ
  const d2 = new Date(v);
  if(!isNaN(d2)) return toLocalISODate(d2);
  return null;
}

/* ===================== การคืนเครื่องมือ (คืนก่อนกำหนด / คืนตรงเวลา / คืนสาย) =====================
   ผู้ดูแลระบบเป็นผู้กดคืนเครื่องมือเองเสมอ (ไม่มีการปิดใบยืมอัตโนมัติ)
   ระบบจะเทียบ "วันที่คืน (returnDate)" ที่กำหนดไว้ในใบยืม กับวันที่กดคืนจริง แล้วตั้งสถานะให้อัตโนมัติ:
     - กดคืนก่อนถึงวันครบกำหนด  -> 'early-returned'  (คืนก่อนกำหนด)
     - กดคืนตรงวันครบกำหนดพอดี -> 'returned'         (คืนตรงเวลา)
     - กดคืนหลังวันครบกำหนดไปแล้ว -> 'late-returned'   (คืนสาย/เลยกำหนด)
====================================================================================== */
// หมวดของใบยืมที่ยัง "active" (ยังไม่คืน) เทียบกับวันครบกำหนดคืน ณ วันนี้
// ใช้จัดกลุ่มในเมนู "คืนเครื่องมือ" และเพื่อแจ้งเตือนใบยืมที่เลยกำหนดแล้ว
function borrowTimingCategory(b){
  const today = todayISO();
  if(!b.returnDate) return 'early';
  if(b.returnDate > today) return 'early';   // ยังไม่ถึงกำหนด (ถ้าคืนวันนี้ = คืนก่อนกำหนด)
  if(b.returnDate === today) return 'ontime'; // ถึงกำหนดคืนพอดีวันนี้
  return 'late'; // เลยวันครบกำหนดคืนแล้ว แต่ยังไม่ได้คืน
}
function daysLate(b){
  if(!b.returnDate) return 0;
  const d1 = new Date(b.returnDate+'T00:00:00');
  const d2 = new Date(todayISO()+'T00:00:00');
  return Math.max(0, Math.round((d2-d1)/86400000));
}
function lateActiveBorrows(){
  return state.borrows.filter(b=>b.status==='active' && borrowTimingCategory(b)==='late');
}
/* ===================== Calendar logic ===================== */
function calShift(dir){
  let m = state.calendar.month + dir;
  let y = state.calendar.year;
  if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
  state.calendar.month=m; state.calendar.year=y; state.calendar.selectedDay=null;
  render();
}
async function returnBorrowNow(id){
  const b = state.borrows.find(x=>x.id===id);
  if(!b) return;
  const today = todayISO();
  let newStatus, confirmLabel;
  if(!b.returnDate || today < b.returnDate){ newStatus='early-returned'; confirmLabel='ก่อนกำหนด'; }
  else if(today === b.returnDate){ newStatus='returned'; confirmLabel='ตรงเวลา'; }
  else { newStatus='late-returned'; confirmLabel=`สาย (เลยกำหนดมาแล้ว ${daysLate(b)} วัน)`; }
  if(!confirm(`ยืนยันคืนเครื่องมือ${confirmLabel}สำหรับใบยืม ${b.code} (${b.name})?\nเครื่องมือทุกชิ้นในใบยืมนี้จะกลับมาว่างให้ยืมใหม่ได้ทันที`)) return;
  (b.itemsExpanded||[]).forEach(rec=>{ if(!rec.returned){ rec.returned = true; rec.returnedAt = today; } });
  b.status = newStatus;
  b.actualReturnedAt = new Date().toISOString();
  await saveBorrows();
  render();
}
/* ===================== Reports export/print ===================== */
function statusLabelTH(status){
  if(status==='early-returned') return 'คืนก่อนกำหนด';
  if(status==='late-returned') return 'คืนสาย (เลยกำหนด)';
  if(status==='returned') return 'คืนตรงเวลา';
  return 'กำลังยืมอยู่';
}
function exportExcel(){
  const range = getReportRange();
  const list = filterBorrowsByRange(range);
  const rows = [['รหัสใบยืม','วันที่ยืม','วันที่คืน','หน่วยงาน','ผู้ยืม','เบอร์โทร','พื้นที่','รายการเครื่องมือ','สถานะ']];
  list.forEach(b=>{
    rows.push([b.code, fmtDateShort(b.borrowDate), fmtDateShort(b.returnDate), b.dept, b.name, b.phone||'', b.province, b.items.map(i=>i.name+' x'+i.qty).join(', '), statusLabelTH(b.status)]);
  });
  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'รายงาน');
  XLSX.writeFile(wb, `รายงานการยืมเครื่องมือ_${todayISO()}.xlsx`);
}
function _resizeReportCharts(){
  Object.values(_reportChartInstances).forEach(c=>{ try{ c.resize(); }catch(e){} });
}
function printReport(){
  document.body.classList.add('printing-report');
  // Charts are sized/drawn for the on-screen layout. The print stylesheet changes the
  // width/height of their containers, but Chart.js only redraws on an explicit resize -
  // without this, canvases print stretched/blurry instead of matching the new box size.
  // Two animation-frame waits give the browser time to apply the print CSS and reflow
  // the layout before we tell Chart.js to redraw at the new size.
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      _resizeReportCharts();
      window.print();
    });
  });
}
window.addEventListener('afterprint', ()=>{
  document.body.classList.remove('printing-report');
  _resizeReportCharts();
});

/* ===================== Realtime sync (Firestore onSnapshot) =====================
   ใช้ Firestore real-time listener (onSnapshot) แทนการ polling เดิม
   เมื่อมีการเปลี่ยนแปลงข้อมูล (เช่น มีคนกดส่งใบยืมจากมือถือ) Firestore จะ "push"
   ข้อมูลล่าสุดมาให้ทุกเครื่องที่เปิดหน้านี้อยู่ทันที ไม่ต้องรอรอบเวลา
====================================================================== */
let _unsubEquipmentList = null;
let _unsubBorrowsList = null;

/* ----- Toast แจ้งเตือนแบบพรีวิวจางๆ (ขึ้น ~3 วิ แล้วหายเอง) ----- */
function ensureToastContainer(){
  let c = document.getElementById('notif-toast-container');
  if(!c){
    c = document.createElement('div');
    c.id = 'notif-toast-container';
    c.className = 'notif-toast-container';
    document.body.appendChild(c);
  }
  return c;
}
function showNotifToast(title, sub, icon, type){
  const c = ensureToastContainer();
  const el = document.createElement('div');
  el.className = 'notif-toast';
  el.innerHTML = `
    <div class="notif-toast-icon ${type==='late'?'late':''}">${icon||'🔔'}</div>
    <div class="notif-toast-text">
      <div class="notif-toast-title">${esc(title)}</div>
      ${sub ? `<div class="notif-toast-sub">${esc(sub)}</div>` : ''}
    </div>`;
  el.addEventListener('click', ()=>{ el.remove(); });
  c.appendChild(el);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.classList.add('show'); }); });
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=>{ el.remove(); }, 350);
  }, 7000);
}

function applyEquipmentListUpdate(eq){
  if(!Array.isArray(eq)) return;
  const cur = JSON.stringify(state.equipment), next = JSON.stringify(eq);
  if(cur === next) return;
  state.equipment = eq;
  {
    const calibChanged = autoUpdateCalibStatus();
    const orderChanged = ensureEquipOrder();
    if(calibChanged || orderChanged){ saveEquipment(); }
  }
  render();
}
function applyBorrowsListUpdate(br){
  if(!Array.isArray(br)) return;
  const cur = JSON.stringify(state.borrows), next = JSON.stringify(br);
  if(cur === next) return;

  // ตรวจจับใบยืมใหม่ที่เพิ่งเข้ามา (ยังไม่เคยเห็นมาก่อนในเครื่องนี้) เพื่อขึ้น toast แจ้งเตือน
  const prevIds = new Set(state.borrows.map(b=>b.id));
  const freshNew = br.filter(b=>!prevIds.has(b.id));

  state.borrows = br;
  render();

  if(state.loggedIn && freshNew.length){
    const shown = freshNew.slice(0, 3);
    shown.forEach(b=>{
      showNotifToast(`📥 มีใบยืมใหม่: ${b.code||''}`, `${b.dept||'-'} • ${b.name||'-'}`, '📥', 'new');
    });
    if(freshNew.length > shown.length){
      showNotifToast(`และอีก ${freshNew.length - shown.length} รายการ`, '', '🔔', 'new');
    }
  }
}

// เผื่อกรณี real-time listener เชื่อมต่อไม่ได้ (เน็ตหลุด/ถูกบล็อก) ใช้ polling เป็นตัวสำรอง
let _syncBusy = false;
async function pollRealtimeUpdates(){
  if(_syncBusy) return;
  _syncBusy = true;
  try{
    const [eq, br] = await Promise.all([ stGet('equipment:list', true), stGet('borrows:list', true) ]);
    applyEquipmentListUpdate(eq);
    applyBorrowsListUpdate(br);
  }catch(e){ /* เงียบไว้ ไม่รบกวนผู้ใช้ถ้าเน็ตหลุดชั่วคราว */ }
  finally{ _syncBusy = false; }
}

function startRealtimeSync(){
  let listenersOk = false;
  try{
    _unsubEquipmentList = db.collection(FS_COLLECTION).doc('equipment:list')
      .onSnapshot(
        snap=>{ if(snap.exists){ const d=snap.data(); applyEquipmentListUpdate(d && d.value); } },
        err=>{ console.warn('equipment realtime listener error, fallback to polling', err); startFallbackPolling(); }
      );
    _unsubBorrowsList = db.collection(FS_COLLECTION).doc('borrows:list')
      .onSnapshot(
        snap=>{ if(snap.exists){ const d=snap.data(); applyBorrowsListUpdate(d && d.value); } },
        err=>{ console.warn('borrows realtime listener error, fallback to polling', err); startFallbackPolling(); }
      );
    listenersOk = true;
  }catch(e){ console.warn('onSnapshot ใช้งานไม่ได้, ใช้ polling แทน', e); }

  if(!listenersOk) startFallbackPolling();

  // ซิงก์ทันทีเมื่อผู้ใช้กลับมาที่แท็บ/หน้าต่างนี้อีกครั้ง (เผื่อพลาดอัปเดตตอนแท็บถูกพักไว้)
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) pollRealtimeUpdates(); });
}

let _fallbackPollStarted = false;
function startFallbackPolling(){
  if(_fallbackPollStarted) return;
  _fallbackPollStarted = true;
  setInterval(pollRealtimeUpdates, 6000);
}

/* ===================== นาฬิกาแสดงวันที่/เวลาปัจจุบันบนหัวเว็บ ===================== */
function updateLiveClock(){
  const el = document.getElementById('live-clock');
  if(!el) return;
  const d = new Date();
  const dateStr = `${THAI_DAYS[d.getDay()]}ที่ ${d.getDate()} ${THAI_MONTHS[d.getMonth()]} พ.ศ. ${beYear(d.getFullYear())}`;
  const timeStr = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')} น.`;
  el.textContent = `🕐 ${dateStr} — ${timeStr}`;
}
function startLiveClock(){
  updateLiveClock();
  setInterval(updateLiveClock, 1000);
}

/* ===================== Boot ===================== */
(async function boot(){
  await authReady; // รอให้ล็อกอินแบบไม่ระบุตัวตนเสร็จก่อน ป้องกัน error permission-denied
  await initData();
  render();
  startRealtimeSync(); // real-time listener (onSnapshot) — อัปเดตทันทีที่มีการเปลี่ยนแปลง
  startLiveClock();
})();

</script>
